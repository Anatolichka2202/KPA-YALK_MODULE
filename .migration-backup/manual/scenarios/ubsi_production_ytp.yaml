schema: 1
id: ktma.ubsi.production.ytp
title: Производство УБСИ · ЯТП
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

steps:
  - id: supply_status
    title: Включение и контроль питания перед проверкой ЯТП
    tu: PRODUCTION / YTP / POWER
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: ytp_stream
    title: Запуск потока ЯТП
    tu: PRODUCTION / YTP / STREAM
    procedure: ytp.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      protocol: rokt_ytp68
      ytp_endpoint: 1
      isd_switch_type: 7
      isd_route_channels: 3,9,12,17
      stream_settle_ms: 1000
      timeout_ms: 3000

  - id: ytp_calibration
    title: Калибровка ЯТП по словам 32 и 31
    tu: PRODUCTION / YTP / CALIBRATION
    procedure: ytp.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
    args:
      calibration_zero_parameter: ytp_calibration_zero
      calibration_full_parameter: ytp_calibration_full
      calibration_mapping_confirmed: true
      sample_count: 16

  - id: ytp_channels
    title: 30 каналов ЯТП · ручной Р4831 · 0 / 120 / 240 Ом
    tu: PRODUCTION / YTP / CHANNELS
    procedure: ytp.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - operator.manual_input
    args:
      channel_count: 30
      parameter_group: ytp_temperature
      resistance_points_ohm: 0,120,240
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500
      conversion_confirmed: true
      criteria_confirmed: true

  - id: ytp_cleanup
    title: Безопасная остановка потока ЯТП
    tu: PRODUCTION / YTP / SAFE_CLEANUP
    procedure: ytp.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      isd_switch_type: 7
      isd_route_channels: 3,9,12,17

  - id: power_off
    title: Отключение питания
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
