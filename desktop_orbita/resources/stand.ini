; Профиль рабочего места КТМА. Адреса не зашиты в доменную логику.
; Значения ИСД и источника питания перенесены из legacy Periphery.ini и
; должны быть подтверждены на текущем стенде перед активным испытанием.

[network]
localAddress=192.168.0.50

[ubsiAdapter]
host=192.168.0.101
dataPort=1001
ackPort=1101
timeoutMs=800

[isd]
host=192.168.0.55
port=80
timeoutMs=1500
switchType=2

[r4831]
port=COM7
baud=9600
timeoutMs=1000
decimalComma=false

[powerSupply]
host=192.168.0.221
commandPort=4001
localReplyPort=6008
timeoutMs=1500
; Только после подтверждения, что текущий АКИП подключён через тот же мост и
; принимает команды VOLT/CURR/SOUT из референсной программы.
allowLegacyCommands=false
