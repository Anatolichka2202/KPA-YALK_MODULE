[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miltech-enterprise-slice1"
version = "0.3.0"
description = "MilTech Station Enterprise pilot: station registry, immutable run intake, offline edge outbox, station environment preflight"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "psutil>=6,<8", "cryptography>=42,<50"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
miltech-edge = "miltech_edge.cli:main"
miltech-db = "miltech_server.db_cli:main"
miltech-enterprise-migrate = "miltech_server.apply_pg_migrations:main"
miltech-station-db = "miltech_edge.station_db_cli:main"
miltech-station-snapshot = "miltech_edge.snapshot_station:main"
miltech-legacy-probe = "miltech_edge.legacy_probe:main"
miltech-delivery = "miltech_delivery.cli:main"

[tool.setuptools.packages.find]
include = ["miltech_server*", "miltech_edge*", "miltech_delivery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"miltech_edge.db" = ["*.sql"]
