name: ComponentProfile desktop cleanup

on:
  push:
    branches: [universal_miltechstation]
    paths:
      - .github/workflows/refactor-desktop-components-once.yml
      - tools/apply_component_profile_desktop_cleanup.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0
      - name: Apply cleanup
        run: python tools/apply_component_profile_desktop_cleanup.py
      - name: Verify and commit
        run: |
          git diff --check
          ! grep -R -n 'standProfile_\.devices' apps/desktop
          ! grep -R -n 'bindCapabilities' apps/desktop
          grep -n 'component.kind != "equipment"' apps/desktop/mainwindow.cpp
          grep -n 'component.capabilities' apps/desktop/mainwindow.cpp
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp
          git commit -m "refactor(desktop): read equipment metadata from components"
          git push origin HEAD:universal_miltechstation
