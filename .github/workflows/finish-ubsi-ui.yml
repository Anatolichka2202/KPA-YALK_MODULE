name: Finish UBSI UI bindings

on:
  push:
    branches: [new-dis]
    paths:
      - .github/workflows/finish-ubsi-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-dis
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/finish_ubsi_ui_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add station/src/ubsi_procedures.cpp apps/desktop/test_page_ui.h apps/desktop/test_page.cpp apps/desktop/tests/test_page_power_yalk_event_test.cpp
          git diff --cached --check
          git commit -m "ui: finish YALK initial state and result summary"
          git rm tools/finish_ubsi_ui_patch.py .github/workflows/finish-ubsi-ui.yml
          git commit -m "chore: remove one-shot UI patch tooling"
          git push origin HEAD:new-dis
