name: Finish UBSI UI bindings

on:
  push:
    branches: [new-dis]
    paths:
      - .github/workflows/finish-ubsi-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-dis
          fetch-depth: 0
      - name: Apply final UI bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Backend -> UI live events for the real YALK open-circuit/initial-state check.
          path = 'station/src/ubsi_procedures.cpp'
          old = '''        analog.attributes = {{"ulk_address", binding.locator},
                             {"raw", std::to_string(reading.raw)},
                             {"analog_code", std::to_string(reading.code)},
                             {"yalk_v", std::to_string(volts)},
                             {"signal", reading.signal ? "1" : "0"}};
        append(result, std::move(analog));
        append(result, measurement("ubsi.yalk.initial.signal." + binding.locator,
            "ЯЛК адрес " + binding.locator + ": исходный сигнал",
            1, reading.signal ? 1 : 0, 1, 1, "лог."));
'''
          new = '''        analog.attributes = {{"ulk_address", binding.locator},
                             {"raw", std::to_string(reading.raw)},
                             {"analog_code", std::to_string(reading.code)},
                             {"yalk_v", std::to_string(volts)},
                             {"signal", reading.signal ? "1" : "0"}};
        auto signalResult = measurement("ubsi.yalk.initial.signal." + binding.locator,
            "ЯЛК адрес " + binding.locator + ": исходный сигнал",
            1, reading.signal ? 1 : 0, 1, 1, "лог.");
        signalResult.attributes = {{"ulk_address", binding.locator},
                                   {"signal", reading.signal ? "1" : "0"},
                                   {"expected_signal", "1"}};
        const auto channelVerdict = combineVerdicts(analog.verdict, signalResult.verdict);
        auto eventData = analog.attributes;
        eventData["channel_index"] = std::to_string(channel + 1);
        eventData["channel_count"] = std::to_string(count);
        eventData["expected_signal"] = "1";
        eventData["analog_ok"] = analog.verdict == RunVerdict::Ok ? "1" : "0";
        eventData["signal_ok"] = signalResult.verdict == RunVerdict::Ok ? "1" : "0";
        context.eventSink({std::chrono::system_clock::now(), node.id, "YALK_INITIAL",
            analog.title, channelVerdict, std::move(eventData)});
        append(result, std::move(analog));
        append(result, std::move(signalResult));
'''
          replace_once(path, old, new)

          # 2) Initial-state grid: display the actual physical YALK addresses and both criteria.
          path = 'apps/desktop/test_page_ui.h'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          start = text.index('class StateGrid final : public QWidget')
          end = text.index('\nQString pageStyle()', start)
          new_class = r'''class StateGrid final : public QWidget
{
public:
    explicit StateGrid(QWidget* parent=nullptr):QWidget(parent)
    {
        setObjectName(QStringLiteral("yalkInitialStateGrid"));
        setMinimumHeight(280);
    }

    void clear()
    {
        states_.clear();
        order_.clear();
        current_.clear();
        setProperty("initialMeasurementCount", 0);
        setProperty("initialFailureCount", 0);
        update();
    }

    void setInitial(QString key, double volts, int signal, bool passed)
    {
        if (!states_.contains(key)) {
            order_.push_back(key);
            std::sort(order_.begin(), order_.end(), [](const QString& left, const QString& right) {
                return left.toInt() < right.toInt();
            });
        }
        states_[key] = {volts, signal, passed, true};
        current_ = std::move(key);
        int failures = 0;
        for (auto it = states_.cbegin(); it != states_.cend(); ++it)
            if (!it.value().passed) ++failures;
        setProperty("initialMeasurementCount", states_.size());
        setProperty("initialFailureCount", failures);
        update();
    }

    // Kept for compatibility with older callers; the initial-state screen uses setInitial().
    void setCurrent(QString key, int signal, int expected)
    {
        setInitial(std::move(key), 0.0, signal, signal == expected);
    }

protected:
    void paintEvent(QPaintEvent*) override
    {
        QPainter p(this);
        p.setRenderHint(QPainter::Antialiasing);
        p.fillRect(rect(), QColor("#0e1115"));
        const int cols = 10;
        const int rows = 8;
        const double gap = 3.0, margin = 8.0;
        const double cw = (width() - 2 * margin - gap * (cols - 1)) / cols;
        const double ch = (height() - 2 * margin - gap * (rows - 1)) / rows;

        for (int index = 0; index < 80; ++index) {
            const int row = index / cols, col = index % cols;
            const QRectF cell(margin + col * (cw + gap), margin + row * (ch + gap), cw, ch);
            const QString key = index < order_.size() ? order_[index] : QString();
            const bool known = !key.isEmpty() && states_.contains(key);
            const InitialState state = known ? states_.value(key) : InitialState{};
            QColor fill = QColor("#111820");
            QColor border = QColor("#27313c");
            if (known) {
                fill = state.passed ? QColor("#13251c") : QColor("#261719");
                border = state.passed ? QColor("#315c43") : QColor("#8f4549");
            }
            if (key == current_) {
                fill = QColor("#132033");
                border = QColor("#5e93b8");
            }
            p.setPen(QPen(border, key == current_ ? 2 : 1));
            p.setBrush(fill);
            p.drawRoundedRect(cell, 3, 3);
            p.setBrush(Qt::NoBrush);

            p.setPen(QColor("#9aafbf"));
            p.setFont(QFont("Segoe UI", 8));
            p.drawText(cell.adjusted(5, 2, -5, -2), Qt::AlignTop | Qt::AlignLeft,
                       known ? QStringLiteral("Адрес %1").arg(key) : QStringLiteral("—"));
            if (!known) continue;

            p.setPen(state.passed ? QColor("#dce6ef") : QColor("#e1766d"));
            p.setFont(QFont("Segoe UI", 8, QFont::DemiBold));
            p.drawText(cell.adjusted(5, 12, -5, -2), Qt::AlignBottom | Qt::AlignLeft,
                       QStringLiteral("U %1 В · D %2")
                           .arg(state.volts, 0, 'f', 2).arg(state.signal));
        }
    }

private:
    struct InitialState {
        double volts = 0.0;
        int signal = 0;
        bool passed = false;
        bool known = false;
    };
    QHash<QString, InitialState> states_;
    QVector<QString> order_;
    QString current_;
};
'''
          p.write_text(text[:start] + new_class + text[end:], encoding='utf-8')

