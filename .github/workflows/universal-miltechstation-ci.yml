name: universal MilTechStation CI

on:
  push:
    branches:
      - universal_miltechstation

permissions:
  contents: write

jobs:
  migrate-desktop-station-session:
    name: Apply StationSession ownership migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0

      - name: Patch MainWindow ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/mainwindow.cpp")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '        componentRuntime_ = std::make_unique<orbita::stand::ComponentRuntime>();\n',
                  ''
              ),
              (
                  '            componentRuntime_->instantiate(standProfile_, {"sample_source"});\n',
                  '            stationSession_.configure(\n'
                  '                standProfile_, root.filePath("plugins").toStdString(), {"sample_source"},\n'
                  '                orbita::stand::EquipmentInstantiation::Deferred);\n'
              ),
              (
                  '        equipmentPlugins_ = std::make_unique<orbita::stand::EquipmentPluginManager>();\n',
                  ''
              ),
              (
                  '        equipmentRegistry_ = std::make_unique<orbita::stand::EquipmentRegistry>();\n',
                  ''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement, got {count}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Restore CI and commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/universal-miltechstation-ci.yml > .github/workflows/universal-miltechstation-ci.yml
          git rm -f .github/workflows/desktop-station-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp .github/workflows/universal-miltechstation-ci.yml
          git diff --cached --check
          git commit -m "refactor(desktop): compose stand through StationSession"
          git push origin HEAD:universal_miltechstation
