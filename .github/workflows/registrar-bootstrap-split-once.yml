name: registrar bootstrap split

on:
  push:
    branches: [universal_miltechstation]
    paths:
      - .github/workflows/registrar-bootstrap-split-once.yml
      - tools/apply_registrar_bootstrap_split.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0
      - name: Apply split
        run: python tools/apply_registrar_bootstrap_split.py
      - name: Verify and commit
        run: |
          git diff --check
          ! grep -R -n 'ktma::registrar' apps/desktop/mainwindow.*
          ! grep -R -n 'pendingProductionStageAttemptId_' apps/desktop/mainwindow.*
          ! grep -R -n 'pendingProductionReportMetadata_' apps/desktop/mainwindow.*
          ! grep -n 'registrar_' apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h
          grep -n 'std::unique_ptr<ktma::registrar::Registrar> registrar_' apps/desktop/ktma_mainwindow.h
          grep -n 'registrar_ = std::make_unique<ktma::registrar::Registrar>' apps/desktop/ktma_mainwindow.cpp
          grep -n 'integrationToolsMenu' apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp apps/desktop/ktma_mainwindow.h
          git commit -m "refactor(desktop): move registrar bootstrap to KTMA composition"
          git push origin HEAD:universal_miltechstation
