name: profile bootstrap split

on:
  push:
    branches: [universal_miltechstation]
    paths:
      - .github/workflows/profile-bootstrap-split-once.yml
      - tools/apply_profile_bootstrap_split.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0
      - name: Apply split
        run: python tools/apply_profile_bootstrap_split.py
      - name: Verify and commit
        run: |
          git diff --check
          ! grep -n 'stand_ktma.yaml' apps/desktop/mainwindow.cpp
          ! grep -n 'initializeStandRuntime();' apps/desktop/mainwindow.cpp
          grep -n 'integrationConfigureStandProfile' apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp
          grep -n 'standProfilePath_' apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h
          grep -n 'stand_ktma.yaml' apps/desktop/ktma_mainwindow.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp
          git commit -m "refactor(desktop): move profile bootstrap to KTMA composition"
          git push origin HEAD:universal_miltechstation
