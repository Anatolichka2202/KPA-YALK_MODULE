name: KTMA scenario bootstrap split

on:
  push:
    branches: [universal_miltechstation]
    paths:
      - .github/workflows/refactor-ktma-scenario-bootstrap-once.yml
      - tools/apply_ktma_scenario_bootstrap_split.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0
      - name: Apply architecture split
        run: python tools/apply_ktma_scenario_bootstrap_split.py
      - name: Verify and commit
        run: |
          git diff --check
          ! grep -n 'orbita_stand/ubsi_procedures.h' apps/desktop/mainwindow.cpp
          ! grep -n 'registerUbsiProcedures' apps/desktop/mainwindow.cpp
          grep -n 'ktma/ubsi/procedures.h' apps/desktop/ktma_mainwindow.cpp
          grep -n 'void KtmaMainWindow::loadTuScenarios' apps/desktop/ktma_mainwindow.cpp
          grep -n 'loadTuScenarios' apps/desktop/ktma_mainwindow.h
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp apps/desktop/ktma_mainwindow.cpp apps/desktop/ktma_mainwindow.h plans/active/universal-miltechstation-backend.md
          git commit -m "refactor(ktma): own TU scenario bootstrap in delivery"
          git push origin HEAD:universal_miltechstation
