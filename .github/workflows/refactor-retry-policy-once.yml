name: one-shot retry policy cleanup

on:
  push:
    branches:
      - universal_miltechstation
    paths:
      - .github/workflows/refactor-retry-policy-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0

      - name: Remove legacy retry argument path
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          scenario = "station/src/scenario.cpp"
          replace_exact(scenario,
              '// Programmatic schema-1 tests still construct ScenarioNode aggregates with the\n'
              '// old arguments key. YAML-loaded scenarios never take this path because the\n'
              '// loader consumes technical_retries into the typed policy.\n'
              'bool retryLimit(const ScenarioNode& node, unsigned& value)\n'
              '{\n'
              '    value = node.policy.technicalRetries;\n'
              '    if (value > 3) return false;\n'
              '    if (value != 0) return true;\n\n'
              '    const auto legacy = node.arguments.find("technical_retries");\n'
              '    if (legacy == node.arguments.end()) return true;\n'
              '    try {\n'
              '        std::size_t parsed = 0;\n'
              '        const auto retries = std::stoull(legacy->second, &parsed);\n'
              '        if (parsed != legacy->second.size() || retries > 3) return false;\n'
              '        value = static_cast<unsigned>(retries);\n'
              '        return true;\n'
              '    } catch (...) {\n'
              '        return false;\n'
              '    }\n'
              '}\n',
              'bool retryLimit(const ScenarioNode& node, unsigned& value)\n'
              '{\n'
              '    value = node.policy.technicalRetries;\n'
              '    return value <= 3;\n'
              '}\n')

          test = "deliveries/ktma/ubsi/tests/scenario_runtime_test.cpp"
          replace_exact(test,
              '    auto retryScenario = smallScenario();\n'
              '    retryScenario.steps = {{"retry", "Retry", "1.1", "flaky", {"a"},\n'
              '                            {{"technical_retries", "3"}}, {}}};\n',
              '    auto retryScenario = smallScenario();\n'
              '    retryScenario.steps = {{"retry", "Retry", "1.1", "flaky", {"a"}, {}, {}}};\n'
              '    retryScenario.steps.front().policy.technicalRetries = 3;\n')

      - name: Verify policy boundary
        run: |
          git diff --check
          ! grep -n 'arguments.find("technical_retries")' station/src/scenario.cpp
          ! grep -n '{{"technical_retries", "3"}}' deliveries/ktma/ubsi/tests/scenario_runtime_test.cpp
          grep -n 'policy.technicalRetries = 3' deliveries/ktma/ubsi/tests/scenario_runtime_test.cpp

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add station/src/scenario.cpp deliveries/ktma/ubsi/tests/scenario_runtime_test.cpp
          git commit -m "refactor(scenario): make retry policy typed-only"
          git push origin HEAD:universal_miltechstation
