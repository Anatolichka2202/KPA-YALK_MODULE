name: one-shot desktop readiness boundary cleanup

on:
  push:
    branches:
      - universal_miltechstation
    paths:
      - .github/workflows/refactor-desktop-readiness-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0

      - name: Remove KTMA readiness from reusable shell
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          main_path = Path("apps/desktop/mainwindow.cpp")
          text = main_path.read_text(encoding="utf-8")
          connection = "    connect(testPage_, &TestPage::equipmentCheckRequested,\n            this, &MainWindow::onCheckTestEquipment);\n"
          if text.count(connection) != 1:
              raise SystemExit(f"mainwindow.cpp: readiness connection count={text.count(connection)}")
          text = text.replace(connection, "", 1)
          start_marker = "void MainWindow::onCheckTestEquipment()\n{"
          end_marker = "std::string MainWindow::invokeOrbitaParameterSource("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("mainwindow.cpp: cannot locate readiness function boundary")
          text = text[:start] + text[end:]
          main_path.write_text(text, encoding="utf-8")

          replace_once(
              "apps/desktop/mainwindow.h",
              "    std::vector<std::shared_ptr<orbita::stand::EquipmentDevice>>& integrationEquipmentDevices()\n    {\n        return equipmentDevices_;\n    }\n",
              "")
          replace_once(
              "apps/desktop/mainwindow.h",
              "    std::vector<std::shared_ptr<orbita::stand::EquipmentDevice>>& equipmentDevices_ =\n        stationSession_.equipmentDevices();\n",
              "")
          replace_once(
              "apps/desktop/mainwindow.h",
              "    void onCheckTestEquipment();\n",
              "")

          old = "    // MainWindow historically connected this signal to a broad stand check.\n    // UBSI has a stricter contract: Preparation probes only devices required by\n    // the selected scenario. Replace that inherited connection with the scoped one.\n    QObject::disconnect(page, &TestPage::equipmentCheckRequested, this, nullptr);\n    connect(page, &TestPage::equipmentCheckRequested,\n            this, &KtmaMainWindow::checkSelectedEquipment);\n"
          new = "    // Physical readiness is delivery-owned: UBSI probes only devices required\n    // by the selected scenario and preserves its confirmed power-up order.\n    connect(page, &TestPage::equipmentCheckRequested,\n            this, &KtmaMainWindow::checkSelectedEquipment);\n"
          replace_once("apps/desktop/ktma_mainwindow.cpp", old, new)

      - name: Verify shell boundary
        run: |
          git diff --check
          ! grep -R -n 'onCheckTestEquipment' apps/desktop/mainwindow.*
          ! grep -R -n 'integrationEquipmentDevices' apps/desktop
          ! grep -R -n 'equipmentDevices_' apps/desktop/mainwindow.*
          grep -n 'KtmaMainWindow::checkSelectedEquipment' apps/desktop/ktma_mainwindow.cpp

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp
          git commit -m "refactor(desktop): move physical readiness to delivery"
          git push origin HEAD:universal_miltechstation
