name: one-shot desktop readiness boundary cleanup

on:
  push:
    branches:
      - universal_miltechstation
    paths:
      - .github/workflows/refactor-desktop-readiness-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal_miltechstation
          fetch-depth: 0

      - name: Remove KTMA readiness from reusable shell
        shell: python
        run: |
          from pathlib import Path

          main_path = Path("apps/desktop/mainwindow.cpp")
          text = main_path.read_text(encoding="utf-8")
          connection = '''    connect(testPage_, &TestPage::equipmentCheckRequested,
                  this, &MainWindow::onCheckTestEquipment);
'''
          if text.count(connection) != 1:
              raise SystemExit(f"mainwindow.cpp: readiness connection count={text.count(connection)}")
          text = text.replace(connection, "", 1)

          start_marker = "void MainWindow::onCheckTestEquipment()\n{"
          end_marker = "std::string MainWindow::invokeOrbitaParameterSource("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("mainwindow.cpp: cannot locate readiness function boundary")
          text = text[:start] + text[end:]
          main_path.write_text(text, encoding="utf-8")

          header_path = Path("apps/desktop/mainwindow.h")
          header = header_path.read_text(encoding="utf-8")
          accessor = '''    std::vector<std::shared_ptr<orbita::stand::EquipmentDevice>>& integrationEquipmentDevices()
    {
        return equipmentDevices_;
    }
'''
          if header.count(accessor) != 1:
              raise SystemExit("mainwindow.h: equipmentDevices compatibility accessor mismatch")
          header = header.replace(accessor, "", 1)
          alias = '''    std::vector<std::shared_ptr<orbita::stand::EquipmentDevice>>& equipmentDevices_ =
        stationSession_.equipmentDevices();
'''
          if header.count(alias) != 1:
              raise SystemExit("mainwindow.h: equipmentDevices compatibility alias mismatch")
          header = header.replace(alias, "", 1)
          declaration = "    void onCheckTestEquipment();\n"
          if header.count(declaration) != 1:
              raise SystemExit("mainwindow.h: onCheckTestEquipment declaration mismatch")
          header = header.replace(declaration, "", 1)
          header_path.write_text(header, encoding="utf-8")

          ktma_path = Path("apps/desktop/ktma_mainwindow.cpp")
          ktma = ktma_path.read_text(encoding="utf-8")
          old = '''    // MainWindow historically connected this signal to a broad stand check.
    // UBSI has a stricter contract: Preparation probes only devices required by
    // the selected scenario. Replace that inherited connection with the scoped one.
    QObject::disconnect(page, &TestPage::equipmentCheckRequested, this, nullptr);
    connect(page, &TestPage::equipmentCheckRequested,
            this, &KtmaMainWindow::checkSelectedEquipment);
'''
          new = '''    // Physical readiness is delivery-owned: UBSI probes only devices required
    // by the selected scenario and preserves its confirmed power-up order.
    connect(page, &TestPage::equipmentCheckRequested,
            this, &KtmaMainWindow::checkSelectedEquipment);
'''
          if ktma.count(old) != 1:
              raise SystemExit("ktma_mainwindow.cpp: inherited readiness block mismatch")
          ktma_path.write_text(ktma.replace(old, new, 1), encoding="utf-8")

      - name: Verify shell boundary
        run: |
          git diff --check
          ! grep -R -n 'onCheckTestEquipment' apps/desktop/mainwindow.*
          ! grep -R -n 'integrationEquipmentDevices' apps/desktop
          ! grep -R -n 'equipmentDevices_' apps/desktop/mainwindow.*
          grep -n 'KtmaMainWindow::checkSelectedEquipment' apps/desktop/ktma_mainwindow.cpp

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/mainwindow.cpp apps/desktop/mainwindow.h apps/desktop/ktma_mainwindow.cpp
          git commit -m "refactor(desktop): move physical readiness to delivery"
          git push origin HEAD:universal_miltechstation
