name: BRP minimal CI

on:
  push:
    branches: [tu_brp_minimal]
  pull_request:
    branches: [tu_brp_minimal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brp-minimal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  brp:
    if: github.ref == 'refs/heads/tu_brp_minimal' || (github.event_name == 'pull_request' && github.base_ref == 'tu_brp_minimal')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manual: ['ON', 'OFF']
    env:
      QT_QPA_PLATFORM: offscreen
      CTEST_OUTPUT_ON_FAILURE: '1'
    steps:
      - name: Checkout only BRP branch / PR
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtserialport'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DBRP_ENABLE_MANUAL_TESTS=${{ matrix.manual }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test all registered BRP tests
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brp-ctest-manual-${{ matrix.manual }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore
