schema: 1
id: diagnostic.ubsi.yalk.full.safe
title: Диагностика ЯЛК-96 · 80 каналов без перегрузки
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: draft
steps:
  - id: supply_status
    title: Питание УБСИ
    tu: 1.1.4.3, 1.1.4.5
    procedure: ubsi.supply_status
    requires: [power.dc_supply]
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500
  - id: yalk_stream
    title: Запуск потока ЯЛК
    tu: 5.6 / ЯЛК
    procedure: yalk.start_stream
    requires: [ulk.parameter_source]
    args:
      configure_settle_ms: 500
      timeout_ms: 3000
  - id: yalk_calibration
    title: Калибровка ЯЛК 97/99
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.read_calibration
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      channel_count: 80
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2
  - id: yalk_initial
    title: Обрыв 80 входов ЯЛК
    tu: 1.1.4.10
    procedure: yalk.check_initial_state
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix]
    args:
      channel_count: 80
      sample_count: 4
      full_scale_v: 6.2
  - id: yalk_channels
    title: ЯЛК 0 / 3,1 / 6,2 В
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.check_channels
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      channel_count: 80
      point_volts: 0,3.1,6.2
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 300
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5
  - id: yalk_contact_thresholds
    title: ЯЛК 0 / 0,9 / 2,5 В
    tu: 1.1.4.1
    procedure: yalk.check_channels
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      channel_count: 80
      point_volts: 0,0.9,2.5
      signal_expectations: 0,0,1
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 300
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5
  - id: yalk_cleanup
    title: Безопасное завершение ЯЛК
    tu: 5.6 / ЯЛК
    procedure: yalk.safe_cleanup
    requires: [ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      maximum_residual_voltage_v: 0.2
      settle_ms: 300
  - id: power_off
    title: Отключение питания
    tu: 5.6 / завершение
    procedure: ubsi.power_safe_off
    requires: [power.dc_supply]
