schema: 1
id: ktma-main
version: 2026.08.27-ubsi-1
title: Основной стенд КТМА, Windows 11

# Пока карта кабелей и активные команды не подтверждены на самом стенде,
# плагины разрешают только безопасную диагностику.
active_outputs_confirmed: false

routes:
  # Подтверждено безопасным чтением 28.08.2026: поток КТМА приходит на AI1.
  # Это параметр ПЭВМ/E20, не команда ИСД.
  orbita_e20_channel: 1
  orbita_e20_rate_khz: 10000
  sensor_load_350ma:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  sensor_load_450ma:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yalk_analog:
    base: TODO_CONFIRM
    type: 1
    bus: 0
    min: 0
    max: 4095
    safe: off
  yalk_contacts:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yalk_open:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yalk_overload_positive:
    base: 96
    type: 2
    bus: 0
    safe: off
  yalk_overload_negative:
    base: 95
    type: 2
    bus: 0
    safe: off
  yvp_gain:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  ytp_channel:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yvp_input:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off

devices:
  - id: ubsi-adapter
    plugin: orbita.ubsi_udp
    bind:
      - ubsi.parameter_source
    config:
      # .101 подтверждён как ИСД. Адрес адаптера на стенде пока НЕ подтверждён:
      # .115 не отвечает ARP/ACK 28.08.2026. В архивной прошивке адрес .101,
      # но он конфликтует с ИСД, поэтому не подставляется как рабочий.
      host: 192.168.0.115
      local_address: 192.168.0.50
      data_port: 1001
      ack_port: 1101
      timeout_ms: 800
      # Прямой протокол архивной прошивки: команда режима 44 01 NN, ACK 1101.
      # Старый KPA-вариант на 1113 остаётся отдельным неподтверждённым вариантом.
      device.active_commands_confirmed: false
      protocol: ktma_firmware_udp_v1
  - id: isd
    plugin: orbita.isd_http
    bind:
      - stand.switch_matrix
    config:
      # Подтверждено безопасным HTTP GET 26.08.2026: ответ имеет формат
      # референсной Delphi-программы type=1num=<N>val=<CODE>work=<0|1>.
      host: 192.168.0.101
      port: 80
      timeout_ms: 1500
      switch_type: 2
  - id: v7-reference
    plugin: orbita.v7_visa
    bind:
      - measure.reference_voltage
      - measure.dc_current
      - measure.reference_ac_voltage
      - measure.reference_frequency
    config:
      resource: USB[0-9]*::0x164E::0x0DAD::?*INSTR
      fallback_resource: USB[0-9]*::5710::3501::?*INSTR
      timeout_ms: 2000
      voltage_command: READ?
      current_command: MEAS:CURR:DC?
      ac_voltage_command: MEAS:VOLT:AC?
      frequency_command: MEAS:FREQ?
  - id: dc-supply
    plugin: orbita.akip_1160_pair
    bind:
      - power.dc_supply
    # Исторически это две АКИП-1160/6 (ипНИ и ипБИ). Ресурсы назначаются
    # только после безопасного *IDN?; COM7 пока не идентифицирован.
    enabled: false
    config:
      disabled_reason: Не назначены оба VISA-ресурса АКИП для ролей ипНИ и ипБИ
      resource_ni: TODO_ASSIGN_VISA_RESOURCE
      resource_bi: TODO_ASSIGN_VISA_RESOURCE
      expected_idn: AKIP-1160/6
      timeout_ms: 2000
  - id: generator
    plugin: orbita.rigol_generator
    bind:
      - signal.generator
    # На текущей сборке УБСИ генератор не подключён.
    enabled: false
    config:
      disabled_reason: Генератор в текущей сборке стенда не подключён
      timeout_ms: 2000
  - id: oscilloscope
    plugin: orbita.rigol_dho8xx
    bind:
      - measure.waveform
    # Подключён к схеме, но автоматический канал пока не подтверждён.
    enabled: false
    config:
      disabled_reason: Осциллограф подключён к схеме, но программный захват ещё не подтверждён
      resource: USB[0-9]*::0x1AB1::?*::?*INSTR
      timeout_ms: 4000
