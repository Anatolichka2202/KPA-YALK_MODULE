schema: 1
id: ktma-main
version: 2026.09.11-yvp-1
title: Основной стенд КТМА, Windows 11

# Общие активные воздействия разрешены только для уже подтверждённых устройств.
# Устройства с device.active_commands_confirmed: false остаются доступными для probe,
# но их активные команды блокируются самим плагином.
active_outputs_confirmed: true

# Фактическая кабельная схема стенда. ЯВП-тракт уточнён после сборки 11.09.2026.
connections:
  adapter_rs485: Адаптер RS-485 → X1 ЯП-П
  isd_to_yalk: ИСД → X1, X2, X3 ЯЛК
  v7_reference: В7-78/1 параллельно линии ИСД → ЯЛК
  yalk_measurement_loop: ИСД задаёт воздействие; В7 измеряет эталон; адаптер читает код ЯЛК
  yvp_isd_x5: ИСД X5 → кабель ЯВП 8-1 X2; кабель ЯВП 8-1 X1 → ЯВП-8 X1
  yvp_isd_x6: ИСД X6 → кабель ЯВП 8-2 X5; кабель ЯВП 8-2 X1 → ЯВП-8 X2; X2 → ЯВП-8 X3
  yvp_db9: кабель ЯВП 8-1 X3 DB-9F ↔ кабель ЯВП 8-2 X6 DB-9M
  yvp_stimulus: Rigol DG-1022Z CH1 → вывод З кабеля ЯВП 8-2; вывод Н не используется
  yvp_signal_source: АКИП-1160/6 не участвует в сигнальном тракте ЯВП

routes:
  # Подтверждено безопасным чтением 28.08.2026: поток КТМА приходит на AI1.
  # Это параметр ПЭВМ/E20, не команда ИСД.
  orbita_e20_channel: 1
  orbita_e20_rate_khz: 10000
  sensor_load_350ma:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off

  sensor_load_450ma:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off

  yalk_analog:
    # ЯЛК: номер канала ИСД = адресу УЛК.
    # Напряжение задаётся отдельной командой type=5 в вольтах, bus=1.
    base: 1
    safe: off

  yalk_contacts:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yalk_open:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yalk_overload_positive:
    # KPA report.log: общий источник +12 В, затем type=3
    # подключает его поочерёдно к физическим каналам ИСД 1..88.
    base: 96
    type: 3
    bus: 0
    safe: off
  yalk_overload_negative:
    # Тот же маршрут для -12 В. Схема ИСД и ячейка ЯЛК одинаковы
    # при проверке БСИ и УБСИ; подтверждено оператором 04.09.2026.
    base: 95
    type: 3
    bus: 0
    safe: off

  # Эти два route оставлены только как совместимость со старой конфигурацией.
  # Для ЯВП нельзя использовать base+offset: физический вход коммутируется парой
  # линий ИСД, а коэффициент усиления — комбинацией КУ1..КУ4.
  # До снятия точных HTTP type/num текущий ROKT commissioning их не активирует.
  yvp_gain:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off
  yvp_input:
    base: TODO_CONFIRM
    type: 2
    bus: 0
    safe: off

devices:
  - id: ubsi-adapter
    plugin: orbita.ktma_adapter_udp
    bind:
      - ulk.parameter_source
    config:
      # ЯЛК: четыре подтверждённые ROKT-команды и кадры 204.
      # ЯТП: общая адресация, затем ROKT 0A 02 00 01 00 и кадры 68 байт.
      # ЯВП: ROKT 0A 01 / 0A 03; payload пока не декодирован.
      # Архивный legacy mode6 (44 01 06, кадры 120/200) сохранён в плагине.
      host: 192.168.0.115
      local_address: 192.168.0.50
      data_port: 1113
      protocol: rokt_yalk
      timeout_ms: 800
      queue_capacity: 4096
      record_root: records
      ytp_protocol: rokt_ytp68
      ytp_endpoint: 1
      # 29.08.2026: ROKT дал 100 reference204 без unknown/drop/timeout.
      device.active_commands_confirmed: true
  - id: isd
    plugin: orbita.isd_http
    bind:
      - stand.switch_matrix
    config:
      # ЯЛК: подготовка type=4/type=7, напряжение type=5 в вольтах с bus=1.
      # Старый type=1 с целым кодом остаётся только для иных маршрутов ИСД.
      host: 192.168.0.101
      port: 80
      timeout_ms: 1500
      switch_type: 2
      # Форматы type=1/2/3/4/5/7 подтверждены Delphi и KPA.
      # Точная карта ЯВП type/num пока не подтверждена.
      device.active_commands_confirmed: true
  - id: v7-reference
    plugin: orbita.v7_visa
    bind:
      - measure.reference_voltage
      - measure.dc_current
      - measure.reference_ac_voltage
      - measure.reference_frequency
    config:
      resource: USB[0-9]*::0x164E::0x0DAD::?*INSTR
      fallback_resource: USB[0-9]*::5710::3501::?*INSTR
      timeout_ms: 2000
      voltage_command: READ?
      current_command: MEAS:CURR:DC?
      ac_voltage_command: MEAS:VOLT:AC?
      frequency_command: MEAS:FREQ?
  - id: dc-supply
    plugin: orbita.akip_1160_pair
    bind:
      - power.dc_supply
    # 01.09.2026 один АКИП-1160/6 аппаратно идентифицирован на COM15.
    # Назначение второго источника ипБИ добавляется через port_bi после *IDN?.
    # 04.09.2026 подтверждено: источник питает УБСИ; новый прогон должен
    # восстановить 27 В после обязательного OUTP OFF предыдущего прогона.
    # Для ЯВП этот АКИП не является источником сигнального воздействия.
    config:
      port: COM15
      baud: 115200
      expected_idn: AKIP-1160/6
      timeout_ms: 1200
      require_both: false
      current_limit_is_total: true
      max_voltage_v: 60
      # OVP must exceed the 37 V survival point. The factory/display value
      # observed for this instrument family is 31 V, which rejects 35/37 V.
      overvoltage_limit_v: 40
      max_current_a: 10
      device.active_commands_confirmed: true
  - id: generator
    plugin: orbita.rigol_generator
    bind:
      - signal.generator
    # Физически подключён: CH1 → вывод З кабеля ЯВП 8-2.
    # На текущем commissioning 1 В выставляется оператором вручную.
    # Автоматический OUTPUT блокируем, пока не подтверждено, что «1 В» = Vpp
    # для программной команды set_sine(amplitude_vpp=...).
    enabled: true
    config:
      timeout_ms: 2000
      device.active_commands_confirmed: false
  - id: oscilloscope
    plugin: orbita.rigol_dho8xx
    bind:
      - measure.waveform
    # Подключён к схеме, но автоматический канал пока не подтверждён.
    enabled: false
    config:
      disabled_reason: Осциллограф подключён к схеме, но программный захват ещё не подтверждён
      resource: USB[0-9]*::0x1AB1::?*::?*INSTR
      timeout_ms: 4000
