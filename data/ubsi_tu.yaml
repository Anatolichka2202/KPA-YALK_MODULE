schema: 1
id: ubsi.tu.normal
# Единственный маршрут поставки: проверка функционирования УБСИ по 5.6.
title: УБСИ · полная проверка по ТУ
version: 1.3.0

# Маршрут: питание -> ЯЛК -> ЯТП -> ЯВП.
# 1.1.4.1 выполняется полностью: потенциометрические и контактные входы ЯЛК
# проверяются напряжением; термосопротивления проверяются трактом ЯТП;
# пьезоэлектрические входы проверяются трактом ЯВП-8 (ровно 8 каналов).
# 1.1.4.14 не является отдельным этапом: погрешность вычисляется в результатах
# соответствующих измерений ЯЛК, ЯТП и ЯВП.
# Не включены 1.1.4.4/1.1.4.12 (изоляция, метод 5.5), 1.1.4.6 (линия 50 м).
# 1.1.4.2: напряжение шести выводов питания датчиков без нагрузки, через ИСД type=3 и В7.
#
# ПОДТВЕРЖДЁННАЯ КОММУТАЦИЯ ИСД / ЯЛК:
# - рабочие адреса ЯЛК: 1-28, 32-43, 45-70, 74-87 — ровно 80 каналов;
# - для этого тракта номер аналогового канала ИСД совпадает с адресом ЯЛК;
# - аналоговый код и сигнальный признак читаются из одного слова reference204:
#   код = 0x03FF, сигнальный признак = 0x0400;
# - перегрузка: общий +12 В = канал 96 type=3, общий -12 В = канал 95 type=3;
#   физические линии 29/30/31/44/71/72/73/88 исключены, так как заняты ЯВП;
# - при перегрузке сравниваются все остальные рабочие адреса с baseline.
steps:
  - id: readiness
    title: Готовность УБСИ после подачи питания не более 30 секунд
    tu: 1.1.4.13
    procedure: power.readiness
    args:
      voltage_v: 27
      current_limit_a: 0.6
      timeout_ms: 30000
      off_settle_ms: 500

  - id: supply_range
    title: Работа при 24 / 27 / 35 В, общий ток до 400 мА и выдержки 19 / 37 В
    tu: 1.1.4.3, 1.1.4.5
    procedure: power.range
    args:
      voltage_points_v: 24,27,35
      maximum_total_current_a: 0.4
      supply_current_limit_a: 0.6
      voltage_tolerance_v: 0.5
      settle_ms: 500
      survival_points_v: 19,37
      survival_seconds: 300,60
      # Полный цикл ТУ: 19 В — 5 минут, 37 В — 1 минута.
      run_survival: true
      restore_voltage_v: 27
      recovery_timeout_ms: 30000

  - id: isd_startup_baseline
    title: Адресная стартовая очистка ИСД и выключение Rigol
    tu: 5.6 / подготовка стенда
    procedure: stand.addressed_baseline
    args:
      # type=4 не используется. Каждый адресный OFF подтверждается ответом ИСД.
      type2_contacts: 1-40
      type3_contacts: 1-96
      analog_type1_contacts: 1-96
      # Не перегружаем HTTP-сервис ИСД серией адресных запросов без пауз.
      isd_command_gap_ms: 30

  - id: sensor_supply_unloaded
    title: Питание датчиков 6,2 ±0,2 В без нагрузки · X1/X2/X3, выводы 36/37
    tu: 1.1.4.2
    procedure: power.sensor_supply_unloaded
    args:
      # ИСД X4: X1/36,37 -> CH89,90; X2/36,37 -> CH91,92;
      # X3/36,37 -> CH93,94. Выводы 38 = 0 В, не подключать.
      nominal_v: 6.2
      tolerance_v: 0.2
      settle_ms: 250

  - id: yalk_stream
    title: Запуск рабочего потока ЯЛК ROKT reference204
    tu: 5.6 / ЯЛК
    procedure: yalk.start
    args:
      configure_settle_ms: 500
      timeout_ms: 3000

  - id: yalk_calibration
    title: Калибровка ЯЛК по адресам 97 и 99
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.calibration
    args:
      addresses: 1-28,32-43,45-70,74-87
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2

  - id: yalk_initial
    title: Обрыв 80 входов ЯЛК и исходный сигнальный признак
    tu: 1.1.4.1, 1.1.4.10
    procedure: yalk.initial
    args:
      addresses: 1-28,32-43,45-70,74-87
      sample_count: 4
      full_scale_v: 6.2
      verdict_policy: formal_norma

  - id: yalk_channels
    title: Аналоговые и контактные каналы ЯЛК · единый проход 0 / 3,1 / 4 / 6,2 В
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.combined
    args:
      addresses: 1-28,32-43,45-70,74-87
      combined_points_v: 0,3.1,4,6.2
      point_volts: 0,3.1,6.2
      contact_points_v: 0,4
      signal_expectations: 0,1
      verdict_policy: formal_norma
      sample_count: 16
      settle_ms: 150
      contact_high_settle_ms: 250
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_overload
    title: Перегрузка ±12 В · 80 каналов · контроль остальных каналов
    tu: 1.1.4.11
    procedure: yalk.overload
    args:
      physical_channels: 1-28,32-43,45-70,74-87
      observed_addresses: 1-28,32-43,45-70,74-87
      positive_overload_contact: 96
      negative_overload_contact: 95
      sample_count: 4
      baseline_settle_ms: 1000
      dac_off_settle_ms: 300
      # 1 с подтверждена успешными точечными пробами адресов 1 и 25.
      overload_settle_ms: 1000
      cleanup_settle_ms: 300
      maximum_code_delta: 5

  - id: yalk_reference_voltage
    title: Служебный эталон полной шкалы ЯЛК 6,2 ±0,03 В · адрес 99
    tu: 1.1.4.9
    procedure: yalk.reference
    args:
      nominal_v: 6.2
      tolerance_v: 0.03
      sample_count: 16

  - id: yalk_cleanup
    title: Снять воздействия ЯЛК и остановить поток
    tu: 5.6 / ЯЛК · завершение
    procedure: yalk.finish
    args:
      maximum_residual_voltage_v: 0.2
      settle_ms: 300

  - id: ytp_stream
    title: Запуск ЯТП через адаптер ROKT 68 байт
    tu: 5.6 / ЯТП
    procedure: ytp.start
    args:
      ytp_endpoint: 1
      configure_settle_ms: 500
      stream_settle_ms: 1000
      timeout_ms: 3000

  - id: ytp_calibration
    title: Калибровка ЯТП по словам 32 и 31
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.calibration
    args:
      sample_count: 16

  - id: ytp_channels
    title: 30 каналов ЯТП · ручной Р4831 · 0 / 120 / 240 Ом
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.channels
    args:
      channel_count: 30
      resistance_points_ohm: 0,120,240
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500

  - id: ytp_cleanup
    title: Остановка потока ЯТП
    tu: 5.6 / ЯТП · завершение
    procedure: ytp.finish

  - id: yvp_channels
    title: ЯВП-8 · коэффициенты усиления и АЧХ · 8 каналов
    tu: 1.1.4.1, 1.1.4.7, 1.1.4.8, 1.1.4.14
    procedure: yvp.run
    args:
      channel_count: 8
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      frequencies_hz: 5,10,20,40,100,250,500,1000,1400,1800,2000,4000
      # АЧХ снимается на подтверждённом K=1; остальные КУ — только при 500 Гц.
      afc_gain_mv_per_pcl: 1
      coupling_capacitance_pf: 1000
      settle_ms: 2000
      # Одиночный тайм-аут В7 не обрывает многочасовой прогон.
      # Всего до трёх чтений при неизменном воздействии.
      v7_read_retries: 2
      v7_retry_delay_ms: 250
      reference_frequency_hz: 500
      gain_tolerance_percent: 7
      attenuation_min_db: 20.0
      verdict_policy: manual_confirmed
      input_switch_type: 2
      gain_switch_type: 2
      measurement_analog_type: 1
      measurement_switch_type: 3
      input_1_contacts: 33
      input_2_contacts: 34
      input_3_contacts: 35
      input_4_contacts: 36
      input_5_contacts: 37
      input_6_contacts: 38
      input_7_contacts: 39
      input_8_contacts: 40
      measurement_1_contacts: 44
      measurement_2_contacts: 29
      measurement_3_contacts: 30
      measurement_4_contacts: 31
      measurement_5_contacts: 71
      measurement_6_contacts: 72
      measurement_7_contacts: 88
      measurement_8_contacts: 73
      channel_1_gain_contacts: 1,2,3,4
      channel_2_gain_contacts: 5,6,7,8
      channel_3_gain_contacts: 9,10,11,12
      channel_4_gain_contacts: 13,14,15,16
      channel_5_gain_contacts: 17,18,19,20
      channel_6_gain_contacts: 21,22,23,24
      channel_7_gain_contacts: 25,26,27,28
      channel_8_gain_contacts: 29,30,31,32
      gain_0_25_bits: none
      gain_0_5_bits: 1
      gain_1_bits: 2
      gain_2_bits: 3
      gain_4_bits: 1,3
      gain_8_bits: 4
      gain_32_bits: 2,4

  - id: power_off
    title: Отключение питания УБСИ после проверки
    tu: 5.6.8
    procedure: power.off
