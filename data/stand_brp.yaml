schema: 1
e2010:
  slot: 0
  # В ACPUnit.pas таблица каналов остаётся нулевой (вход 0).
  channel: 0
  sample_rate_khz: 10000
  buffer_words: 1048576

# Адресные OFF и пауза взяты из isd_startup_baseline в tu-minimal-clean.
isd:
  host: 192.168.0.101

# COM15 подключён к передатчику RS-485. Порт АКИП задаётся отдельно.
rs485:
  port: COM15
akip:
  port: ""
  expected_idn: AKIP-1160/6

isd_baseline:
  type2_last: 40
  type3_last: 96
  dac_last: 96
  command_gap_ms: 30

# Ресурсы и DC-команда из профиля В7 в tu-minimal-clean.
v7:
  resources:
    - USB[0-9]*::0x164E::0x0DAD::?*INSTR
    - USB[0-9]*::5710::3501::?*INSTR
  timeout_ms: 25000
  voltage_command: MEAS:VOLT:DC?
