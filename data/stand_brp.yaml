schema: 1
e2010:
  slot: 0
  # В ACPUnit.pas таблица каналов остаётся нулевой (вход 0).
  channel: 0
  sample_rate_khz: 10000
  buffer_words: 1048576

# Адресные OFF и пауза взяты из isd_startup_baseline в tu-minimal-clean.
isd:
  host: 192.168.0.101

# COM15 подключён к передатчику RS-485. Порт АКИП задаётся отдельно.
rs485:
  port: COM15
akip:
  port: COM9
  expected_idn: AKIP-1160/6
  external: true
  # Указать утверждённые уставки конкретного стенда до запуска реального ТУ.
  voltage_v: null
  current_limit_a: null
  ovp_v: null
  settle_ms: 300

# Активный БП проверяется перед сбросом реле. OVP и OCP читаются отдельно
# от рабочих уставок VOLT и CURR. Профиль пока не включает его выход.
stimulus_akip:
  # На текущем стенде источник воздействий не подключён.
  # При подключении включить проверку OVP/OCP и подтвердить параметры.
  enabled: false
  port: COM16
  expected_idn: AKIP-1160/6
  ovp_v: 42
  ocp_a: 4.7

isd_baseline:
  # Прошивка ИСД принимает 1–64. X6 для ЯГР-4 использует в том числе 41–46.
  type2_last: 64
  type3_last: 96
  dac_last: 96
  command_gap_ms: 30

# Ресурсы и DC-команда из профиля В7 в tu-minimal-clean.
v7:
  resources:
    - USB[0-9]*::0x164E::0x0DAD::?*INSTR
    - USB[0-9]*::5710::3501::?*INSTR
  timeout_ms: 25000
  voltage_command: MEAS:VOLT:DC?
