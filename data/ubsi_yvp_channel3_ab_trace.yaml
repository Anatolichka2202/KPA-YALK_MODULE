id: ubsi.yvp.channel3-ab-trace
title: УБСИ · инженерная A/B-проба ЯВП-3
version: 1.0.0

# Это не acceptance-сценарий. Он сопоставляет текущую методику K=4, 500 Гц,
# 0,5 Vpp с зафиксированной рабочей точкой commissioning K=4, 250 Гц, 1 Vpp.
steps:
  - id: readiness
    title: Однократная подготовка питания перед A/B-пробой ЯВП-3
    tu: инженерная подготовка
    procedure: power.readiness
    args:
      voltage_v: 27
      current_limit_a: 0.6
      timeout_ms: 30000
      off_settle_ms: 500

  - id: yvp_channel3_current_gain_trace
    title: ЯВП-3 · все состояния КУ при 500 Гц
    tu: инженерная диагностика
    procedure: yvp.run
    args:
      channel_count: 8
      tested_channels: 3
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      frequencies_hz: 500
      coupling_capacitance_pf: 1000
      settle_ms: 2000
      v7_read_retries: 2
      v7_retry_delay_ms: 250
      reference_frequency_hz: 500
      diagnostic_gain_only: true
      generator_readback: true
      input_switch_type: 2
      gain_switch_type: 2
      measurement_analog_type: 1
      measurement_switch_type: 3
      input_1_contacts: 33
      input_2_contacts: 34
      input_3_contacts: 35
      input_4_contacts: 36
      input_5_contacts: 37
      input_6_contacts: 38
      input_7_contacts: 39
      input_8_contacts: 40
      measurement_1_contacts: 44
      measurement_2_contacts: 29
      measurement_3_contacts: 30
      measurement_4_contacts: 31
      measurement_5_contacts: 71
      measurement_6_contacts: 72
      measurement_7_contacts: 88
      measurement_8_contacts: 73
      channel_1_gain_contacts: 1,2,3,4
      channel_2_gain_contacts: 5,6,7,8
      channel_3_gain_contacts: 9,10,11,12
      channel_4_gain_contacts: 13,14,15,16
      channel_5_gain_contacts: 17,18,19,20
      channel_6_gain_contacts: 21,22,23,24
      channel_7_gain_contacts: 25,26,27,28
      channel_8_gain_contacts: 29,30,31,32
      gain_0_25_bits: none
      gain_0_5_bits: 1
      gain_1_bits: 2
      gain_2_bits: 3
      gain_4_bits: 1,3
      gain_8_bits: 4
      gain_32_bits: 2,4

  - id: yvp_channel3_legacy_k4_trace
    title: ЯВП-3 · повтор рабочей точки 17.09
    tu: инженерная диагностика
    procedure: yvp.run
    args:
      channel_count: 8
      tested_channels: 3
      gains_mv_per_pcl: 4
      frequencies_hz: 250
      coupling_capacitance_pf: 1000
      settle_ms: 2000
      v7_read_retries: 2
      v7_retry_delay_ms: 250
      reference_frequency_hz: 250
      diagnostic_gain_only: true
      generator_readback: true
      input_switch_type: 2
      gain_switch_type: 2
      measurement_analog_type: 1
      measurement_switch_type: 3
      input_1_contacts: 33
      input_2_contacts: 34
      input_3_contacts: 35
      input_4_contacts: 36
      input_5_contacts: 37
      input_6_contacts: 38
      input_7_contacts: 39
      input_8_contacts: 40
      measurement_1_contacts: 44
      measurement_2_contacts: 29
      measurement_3_contacts: 30
      measurement_4_contacts: 31
      measurement_5_contacts: 71
      measurement_6_contacts: 72
      measurement_7_contacts: 88
      measurement_8_contacts: 73
      channel_1_gain_contacts: 1,2,3,4
      channel_2_gain_contacts: 5,6,7,8
      channel_3_gain_contacts: 9,10,11,12
      channel_4_gain_contacts: 13,14,15,16
      channel_5_gain_contacts: 17,18,19,20
      channel_6_gain_contacts: 21,22,23,24
      channel_7_gain_contacts: 25,26,27,28
      channel_8_gain_contacts: 29,30,31,32
      gain_0_25_bits: none
      gain_0_5_bits: 1
      gain_1_bits: 2
      gain_2_bits: 3
      gain_4_bits: 1,3
      gain_8_bits: 4
      gain_32_bits: 2,4
      gain_4_input_vpp: 1

  - id: power_off
    title: Отключение питания после A/B-пробы ЯВП-3
    tu: инженерное завершение
    procedure: power.off
