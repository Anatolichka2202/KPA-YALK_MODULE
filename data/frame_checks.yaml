schema: 1
# Раскладка из «Адреса Орбита БРП.txt» рядом с FPGA_BRP_2026 в БРП_РПУ.
# T05P01–P08 нумеруют байт от старшего бита к младшему.
checks:
  - number: 1
    title: ПОС1–ПОС4
    tu: 3.2.1.6.1–3.2.1.6.3
    cell: ЯГР1
    addresses: [M16P1A10B20T01, M16P1A10B30T01, M16P1A10B40T01, M16P1A10B50T01]
    channel_names: [ПОС1, ПОС2, ПОС3, ПОС4]
    # Схема кабеля ЯГР-3, распиновка БРП v1.2, ИСД Э3 и KMTable.
    isd_relay_routes:
      - {connector: 5, signal: 1, return: 5}
      - {connector: 5, signal: 2, return: 6}
      - {connector: 5, signal: 3, return: 7}
      - {connector: 5, signal: 4, return: 8}
    voltage_point_tu: 3.2.1.6.3
    scale: {min_v: -6, max_v: 6, min_code: 20, max_code: 1003, tolerance_percent: 1}
    # Временная инженерная сетка точек: внешние воздействия задаёт оператор.
    # Если методика задаёт иную сетку, редактируется YAML, а не измерительный код.
    point_targets_v: [0, 5]
    # Стендовые воздействия только 0 и +5 В; отрицательных точек нет.
    hardware_point_targets_v: [0, 5]
    point_target_window_v: 0.5
    note: Многоточечная сверка ПОС1–ПОС4 с В7 по стендовой шкале ±6 В; точки настраиваются в YAML.
  - number: 2
    title: ПНА
    tu: 3.2.1.6.7–3.2.1.6.8
    cell: ЯГР2
    bits: 1
    addresses: [M16P1A30B31T05P08]
    # ЯГР-4: Ch9 / 0V3. Уровни и источник сигнала задаёт методика ПНА.
    isd_relay_routes: [{connector: 6, signal: 34, return: 38}]
    note: Проверка состояния ПНА в кадре. Физические пороги входа проверяются отдельными воздействиями.
  - number: 3
    title: ББ СУ
    tu: 3.2.1.7.1–3.2.1.7.3
    voltage_point_tu: 3.2.1.7.3
    cell: ЯГР1
    addresses: [M16P1A10B60C11T01]
    isd_relay_routes: [{connector: 5, signal: 9, return: 13}]
    scale: {min_v: 0, max_v: 40, min_code: 0, max_code: 1023, tolerance_percent: 1}
    note: Сравнение одной точки с В7. Шкала кода из РЭ. Разрядность и фактическая частота опроса требуют отдельных проверок.
  - number: 4
    title: ББ ПР
    tu: 3.2.1.7.1–3.2.1.7.3
    voltage_point_tu: 3.2.1.7.3
    cell: ЯГР1
    addresses: [M16P1A10B60C21T01]
    isd_relay_routes: [{connector: 5, signal: 10, return: 14}]
    scale: {min_v: 0, max_v: 40, min_code: 0, max_code: 1023, tolerance_percent: 1}
    note: Сравнение одной точки с В7 по шкале кода из РЭ.
  - number: 5
    title: Ептм
    tu: 3.2.1.7.1–3.2.1.7.3
    voltage_point_tu: 3.2.1.7.3
    cell: ЯГР2
    addresses: [M16P1A10B60C31T01]
    # ЯГР-4: Ch7 / 0V6.
    isd_relay_routes: [{connector: 6, signal: 41, return: 45}]
    scale: {min_v: 0, max_v: 40, min_code: 0, max_code: 1023, tolerance_percent: 1}
    note: Сравнение одной точки с В7 по шкале кода из РЭ.
  - number: 6
    title: Команда 1
    tu: 3.2.1.8.1–3.2.1.8.2
    cell: ЯГР2
    bits: 1
    addresses: [M16P1A30B40C11T05P04]
    note: Сверка состояния в кадре с подготовленным состоянием входа.
  - number: 10
    title: Uск1–Uск4
    tu: 3.2.1.10.1
    cell: ЯГР2
    bits: 1
    addresses: [M16P1A30B40C11T05P08, M16P1A30B40C11T05P07, M16P1A30B40C11T05P06, M16P1A30B40C11T05P05]
    channel_names: [Uск1, Uск2, Uск3, Uск4]
    note: После размыкания и замыкания выбранного сухого контакта сверяем соответствующий бит.
  - number: 11
    title: Uрезерв1–Uрезерв3
    tu: 3.2.1.11.1–3.2.1.11.3
    cell: ЯГР2
    addresses: [M16P1A10B60C41T01, M16P1A10B70C11T01, M16P1A10B70C31T01]
    channel_names: [Uрезерв1, Uрезерв2, Uрезерв3]
    note: В кадре 2026 назначены три адреса. Для сравнения с В7 нужны подтверждённые шкалы конкретной разводки.
  - number: 12
    title: Счётчик RS-485
    tu: 3.2.1.12.1
    cell: ЯФК
    note: Интерфейсная проверка выше. Сравнивается полная последовательность кодов 0–1023.
  - number: 13
    title: ЛПИ / Манчестер
    tu: 3.2.1.12.1
    cell: ЯСМ
    note: Для проверки используется внешнее воздействие тестом ЯСМ и контроль принятой последовательности в M16.
  - number: 14
    title: Контроль стирания
    tu: 3.2.1.13.1–3.2.1.13.2
    cell: ЯГР2
    bits: 1
    addresses: [M16P1A30B40C21T05P07]
    note: Сверка принятого состояния. Воздействие задаётся отдельной методикой модели.
  - number: 15
    title: Исправность
    tu: 3.2.1.13.1–3.2.1.13.2
    cell: ЯГР2
    bits: 1
    addresses: [M16P1A30B40C21T05P08]
    note: Сверка состояния в кадре с подготовленным состоянием входа.
