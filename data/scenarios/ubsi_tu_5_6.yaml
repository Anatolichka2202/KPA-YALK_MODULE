schema: 1
id: ubsi.468157.002.tu5_6.normal
title: УБСИ ЛВРМ.468157.002 — legacy trace сценарий 5.6
version: 1.6.1
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
# Trace-only draft. Текущий published full run — ubsi_ulk_combined_check.yaml.
# Файл намеренно не содержит отвергнутые 350/450 мА, 1.1.4.4,
# 1.1.4.6/50 м, external evidence и старый ЯВП через адреса ЯЛК.
state: draft

steps:
  - id: power_and_readiness
    title: Питание и готовность блока
    steps:
      - id: readiness_30s
        title: Время готовности после включения
        tu: 1.1.4.13
        procedure: ubsi.readiness
        requires:
          - power.dc_supply
          - ulk.parameter_source
        args:
          voltage_v: 27
          current_limit_a: 0.6
          timeout_ms: 30000
      - id: supply_range
        title: Диапазон питания, предельные уровни и общий ток потребления
        tu: 1.1.4.3, 1.1.4.5
        procedure: ubsi.supply_range
        requires:
          - power.dc_supply
          - ulk.parameter_source
        args:
          voltage_points_v: 24,27,35
          maximum_total_current_a: 0.4
          supply_current_limit_a: 0.6
          survival_points_v: 19,37
          survival_seconds: 300,60
          restore_voltage_v: 27
          recovery_timeout_ms: 30000
          settle_ms: 500

  - id: yalk_96
    title: ЯЛК-96 — полный контур ИСД / В7 / адаптер
    steps:
      - id: yalk_stream
        title: Запуск потока ЯЛК
        tu: 5.6 / ЯЛК
        procedure: yalk.start_stream
        requires:
          - ulk.parameter_source
          - stand.switch_matrix
        args:
          configure_settle_ms: 500
          timeout_ms: 3000
      - id: yalk_calibration
        title: Калибровка по адресам ЯЛК 97 и 99
        tu: 1.1.4.1, 1.1.4.14
        procedure: yalk.read_calibration
        requires:
          - catalog.parameter_resolver
          - ulk.parameter_source
          - stand.switch_matrix
          - measure.reference_voltage
        args:
          channel_count: 80
          sample_count: 16
          settle_ms: 150
          full_voltage: 6.2
      - id: yalk_channels
        title: Точки 0 / 3,1 / 6,2 В и сигнальные признаки
        tu: 1.1.4.1, 1.1.4.14
        procedure: yalk.check_channels
        requires:
          - catalog.parameter_resolver
          - ulk.parameter_source
          - stand.switch_matrix
          - measure.reference_voltage
        args:
          channel_count: 80
          point_volts: 0,3.1,6.2
          sample_count: 16
          settle_ms: 150
          channel_off_settle_ms: 1000
          full_scale_v: 6.2
          tolerance_percent_fs: 0.5
      - id: yalk_overload
        title: Обрыв и перегрузка ±12 В
        tu: 1.1.4.10, 1.1.4.11
        procedure: yalk.check_overload
        requires:
          - ulk.parameter_source
          - stand.switch_matrix
        args:
          mapping_confirmed: true
          physical_channel_count: 88
          observed_address_count: 88
          positive_overload_route: yalk_overload_positive
          negative_overload_route: yalk_overload_negative
          sample_count: 4
          overload_settle_ms: 10000
          maximum_code_delta: 2
      - id: yalk_cleanup
        title: Безопасный сброс ЯЛК
        tu: 5.6 / завершение ЯЛК
        procedure: yalk.safe_cleanup
        requires:
          - ulk.parameter_source
          - stand.switch_matrix
          - catalog.parameter_resolver
          - measure.reference_voltage
        args:
          channel_count: 80
          maximum_residual_voltage_v: 0.2

  - id: ytp
    title: ЯТП — термосопротивления
    steps:
      - id: ytp_stream
        title: Запуск потока ЯТП
        tu: 5.6 / ЯТП
        procedure: ytp.start_stream
        requires:
          - ulk.parameter_source
          - stand.switch_matrix
        args:
          protocol: rokt_ytp68
          ytp_endpoint: 1
          isd_switch_type: 7
          isd_route_channels: 3,9,12,17
          timeout_ms: 3000
      - id: ytp_calibration
        title: Калибровка ЯТП 32/31
        tu: 1.1.4.1, 1.1.4.14
        procedure: ytp.read_calibration
        requires:
          - catalog.parameter_resolver
          - ulk.parameter_source
        args:
          calibration_zero_parameter: ytp_calibration_zero
          calibration_full_parameter: ytp_calibration_full
          calibration_mapping_confirmed: true
          sample_count: 16
      - id: ytp_channels
        title: Ручные точки Р4831 0 / 120 / 240 Ом и погрешность
        tu: 1.1.4.1, 1.1.4.14
        procedure: ytp.check_channels
        requires:
          - operator.manual_input
          - ulk.parameter_source
          - catalog.parameter_resolver
        args:
          channel_count: 30
          parameter_group: ytp_temperature
          resistance_points_ohm: 0,120,240
          full_scale_ohm: 240
          tolerance_percent_fs: 0.5
          sample_count: 16
          settle_ms: 1500
          conversion_confirmed: true
          criteria_confirmed: true
      - id: ytp_cleanup
        title: Остановка потока ЯТП
        tu: 5.6 / завершение ЯТП
        procedure: ytp.safe_cleanup
        requires:
          - ulk.parameter_source
          - stand.switch_matrix
        args:
          isd_switch_type: 7
          isd_route_channels: 3,9,12,17

  - id: yvp_8
    title: ЯВП-8 — ROKT transport commissioning
    steps:
      - id: yvp_mode
        title: Готовность Rigol и перевод адаптера в режим ЯВП · ROKT 0A 01
        tu: 5.6 / ЯВП
        procedure: yvp.enter_mode
        requires:
          - ulk.parameter_source
          - signal.generator
        args:
          yvp_cell: 1
          timeout_ms: 3000
          stimulus_source: rigol_ch1
          stimulus_nominal_v: 1
          stimulus_control: manual
          stimulus_amplitude_definition: TODO_CONFIRM
      - id: yvp_channels
        title: ЯВП-8 · выбор каналов ROKT 0A 03 и контроль свежего UDP-трафика
        tu: 1.1.4.1, 1.1.4.7, 1.1.4.8, 1.1.4.14
        procedure: ubsi.yvp
        requires:
          - ulk.parameter_source
        args:
          channel_count: 8
          yvp_cell: 1
          timeout_ms: 3000
      - id: yvp_cleanup
        title: Безопасная остановка ЯВП
        tu: 5.6 / ЯВП · завершение
        procedure: yvp.safe_cleanup
        requires:
          - ulk.parameter_source

  - id: power_off
    title: Отключение питания УБСИ
    tu: 5.6 / безопасное завершение
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
