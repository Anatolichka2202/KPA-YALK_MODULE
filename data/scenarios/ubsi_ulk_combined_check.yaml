schema: 1
id: ubsi.468157.002.ulk.combined.check
title: УБСИ · полная проверка по ТУ
version: 2.6.1
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Канонический current TU backend для метода 5.6.
# Нормативный scope по предоставленному ЛВРМ.468157.002ТУ:
# 1.1.4.1–1.1.4.3, 1.1.4.5–1.1.4.11, 1.1.4.13, 1.1.4.14.
# Пункты, для которых физическая методика ещё не подтверждена, не удаляются:
# после безопасного отключения питания финальный ubsi.tu_scope_gate переводит
# run в INCOMPLETE и тем самым запрещает ложный нормативный OK.
# ЯВП выполняется основным V7+ИСД-контуром: Rigol CH1 через 1000 пФ,
# коммутация ИСД и чтение выбранного выхода штатной линией В7.
# `resources:` задаёт конкретные delivery roles. `requires:` на физических
# capability временно сохранён как compatibility preflight для старого desktop;
# фактические legacy invoke внутри leaf шага маршрутизируются ScenarioEngine
# через единственный resource с соответствующей capability.
steps:
  - id: startup
    title: Подготовка стенда и холодный запуск УБСИ
    steps:
      - id: isd_baseline
        title: Исходное состояние ИСД перед новым прогоном
        tu: 5.6 / ИСД · исходное состояние
        procedure: ubsi.isd_baseline
        requires:
          - stand.switch_matrix
        resources:
          - resource: switch_matrix.primary
            capability: stand.switch_matrix

      - id: readiness
        title: Готовность УБСИ после холодного включения не более 30 секунд
        tu: 1.1.4.13
        procedure: ubsi.readiness
        requires:
          - power.dc_supply
          - ulk.parameter_source
        resources:
          - resource: power.dut
            capability: power.dc_supply
          - resource: dut.parameter_source
            capability: ulk.parameter_source
        args:
          voltage_v: 27
          current_limit_a: 0.6
          off_settle_ms: 500
          timeout_ms: 30000
          technical_retries: 3

  - id: supply_range
    title: Работа при 24 / 27 / 35 В, общий ток до 400 мА и выдержки 19 / 37 В
    tu: 1.1.4.3, 1.1.4.5
    procedure: ubsi.supply_range
    requires:
      - power.dc_supply
      - ulk.parameter_source
    resources:
      - resource: power.dut
        capability: power.dc_supply
      - resource: dut.parameter_source
        capability: ulk.parameter_source
    args:
      voltage_points_v: 24,27,35
      maximum_total_current_a: 0.4
      supply_current_limit_a: 0.6
      voltage_tolerance_v: 0.5
      settle_ms: 500
      survival_points_v: 19,37
      survival_seconds: 300,60
      restore_voltage_v: 27
      recovery_timeout_ms: 30000

  - id: yalk_stream
    title: Запуск потока ЯЛК
    tu: 5.6 / ЯЛК
    procedure: yalk.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
    args:
      configure_settle_ms: 500
      timeout_ms: 3000
      technical_retries: 3

  - id: yalk_calibration
    title: Калибровка ЯЛК по адресам 97 и 99
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_voltage
    args:
      channel_count: 80
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2

  - id: yalk_initial
    title: Обрыв и исходное отключённое состояние 80 входов ЯЛК
    tu: 1.1.4.10
    procedure: yalk.check_initial_state
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
    args:
      channel_count: 80
      sample_count: 4
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_channels
    title: Аналоговые сигналы 80 адресов ЯЛК · 0 / 3,1 / 6,2 В
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_voltage
    args:
      channel_count: 80
      point_volts: 0,3.1,6.2
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_contact_thresholds
    title: "Контактные пороги всех адресов: 0 при 0,0 В, 0 при 0,9 В и 1 при 2,5 В"
    tu: 1.1.4.1
    procedure: yalk.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_voltage
    args:
      channel_count: 80
      point_volts: 0,0.9,2.5
      signal_expectations: 0,0,1
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_overload
    title: Устойчивость остальных каналов при перегрузке ±12 В
    tu: 1.1.4.10, 1.1.4.11
    procedure: yalk.check_overload
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
    args:
      mapping_confirmed: true
      physical_channels: 1-28,32-43,45-70,74-87
      stressed_channels: 1-28,32-43,45-70,74-87
      observed_addresses: 1-28,32-43,45-70,74-87
      positive_overload_route: yalk_overload_positive
      negative_overload_route: yalk_overload_negative
      sample_count: 4
      baseline_settle_ms: 1000
      dac_off_settle_ms: 300
      overload_settle_ms: 10000
      cleanup_settle_ms: 300
      maximum_code_delta: 2

  - id: yalk_reference_voltage
    title: Эталон 6,2 ±0,03 В по В7 и адресу ЯЛК
    tu: 1.1.4.9
    procedure: ubsi.reference_voltage
    requires:
      - measure.reference_voltage
      - catalog.parameter_resolver
      - ulk.parameter_source
    resources:
      - resource: measure.reference
        capability: measure.reference_voltage
      - resource: dut.parameter_source
        capability: ulk.parameter_source
    args:
      nominal_v: 6.2
      tolerance_v: 0.03
      adapter_parameter_group: yalk_reference_supply
      calibration_zero_parameter: yalk_calibration_zero
      calibration_full_parameter: yalk_calibration_full
      sample_count: 16

  - id: yalk_cleanup
    title: Сброс ЯЛК и контроль отсутствия воздействия
    tu: 5.6 / ЯЛК · завершение
    procedure: yalk.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
      - catalog.parameter_resolver
      - measure.reference_voltage
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_voltage
    args:
      channel_count: 80
      maximum_residual_voltage_v: 0.2
      settle_ms: 300
      retry_settle_ms: 500

  - id: ytp_stream
    title: Перевод адаптера в режим ЯТП
    tu: 5.6 / ЯТП
    procedure: ytp.start_stream
    requires:
      - ulk.parameter_source
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
    args:
      protocol: rokt_ytp68
      ytp_endpoint: 1
      stream_settle_ms: 1000
      timeout_ms: 3000
      technical_retries: 3

  - id: ytp_calibration
    title: Калибровка ЯТП по словам 32 и 31
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
    args:
      calibration_zero_parameter: ytp_calibration_zero
      calibration_full_parameter: ytp_calibration_full
      calibration_mapping_confirmed: true
      sample_count: 16

  - id: ytp_channels
    title: Проверка 30 каналов ЯТП в точках 0 / 120 / 240 Ом
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - operator.manual_input
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source
    args:
      channel_count: 30
      parameter_group: ytp_temperature
      resistance_points_ohm: 0,120,240
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500
      conversion_confirmed: true
      criteria_confirmed: true

  - id: ytp_cleanup
    title: Остановка потока ЯТП
    tu: 5.6 / завершение ЯТП
    procedure: ytp.safe_cleanup
    requires:
      - ulk.parameter_source
    resources:
      - resource: dut.parameter_source
        capability: ulk.parameter_source

  - id: yvp_channels
    title: ЯВП-8 · Rigol / ИСД / В7 · КУ и АЧХ
    tu: 1.1.4.1, 1.1.4.7, 1.1.4.8, 1.1.4.14
    procedure: ubsi.yvp
    requires:
      - stand.switch_matrix
      - measure.reference_ac_voltage
      - measure.reference_frequency
      - signal.generator
    resources:
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_ac_voltage
      - resource: measure.reference
        capability: measure.reference_frequency
      - resource: signal.primary
        capability: signal.generator
    args:
      channel_count: 8
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      frequencies_hz: 2,6,20,500,1800,2000,4000
      afc_gain_mv_per_pcl: 1
      reference_frequency_hz: 500
      coupling_capacitance_pf: 1000
      settle_ms: 2000
      v7_read_retries: 2
      v7_retry_delay_ms: 250
      gain_tolerance_percent: 7
      attenuation_min_db: 20.0
      active_outputs_confirmed: true
      mapping_confirmed: true
      input_switch_type: 2
      gain_switch_type: 2
      measurement_analog_type: 1
      measurement_switch_type: 3
      input_1_contacts: 33
      input_2_contacts: 34
      input_3_contacts: 35
      input_4_contacts: 36
      input_5_contacts: 37
      input_6_contacts: 38
      input_7_contacts: 39
      input_8_contacts: 40
      measurement_1_contacts: 44
      measurement_2_contacts: 29
      measurement_3_contacts: 30
      measurement_4_contacts: 31
      measurement_5_contacts: 71
      measurement_6_contacts: 72
      measurement_7_contacts: 88
      measurement_8_contacts: 73
      channel_1_gain_contacts: 1,2,3,4
      channel_2_gain_contacts: 5,6,7,8
      channel_3_gain_contacts: 9,10,11,12
      channel_4_gain_contacts: 13,14,15,16
      channel_5_gain_contacts: 17,18,19,20
      channel_6_gain_contacts: 21,22,23,24
      channel_7_gain_contacts: 25,26,27,28
      channel_8_gain_contacts: 29,30,31,32
      gain_0_25_bits: none
      gain_0_5_bits: 1
      gain_1_bits: 2
      gain_2_bits: 3
      gain_4_bits: 1,3
      gain_8_bits: 4
      gain_32_bits: 2,4

  - id: finalization
    title: Безопасное завершение и контроль полноты ТУ
    steps:
      - id: power_off
        title: Отключение питания УБСИ после проверки
        tu: 5.6.8
        procedure: ubsi.power_safe_off
        requires:
          - power.dc_supply
        resources:
          - resource: power.dut
            capability: power.dc_supply

      - id: tu_scope_gate
        title: Контроль полноты обязательного объёма п. 5.6
        tu: 1.1.4.1, 1.1.4.2, 1.1.4.6, 1.1.4.14
        procedure: ubsi.tu_scope_gate
        args:
          unresolved: "1.1.4.2 (питание датчиков 6,2 В / 350 мА / защита 450 мА); 1.1.4.6 (линия термодатчик–УБСИ до 50 м); 1.1.4.1 (пьезоэлектрические каналы: ТУ требует не менее 16, текущий подтверждённый тракт ЯВП-8 покрывает 8); 1.1.4.14 (входной ток каналов не более 2 мкА)"
          reason: "Для этих требований в текущем master нет подтверждённого физического метода/evidence. Они не могут быть исключены из 5.6 и не могут автоматически считаться выполненными."
