schema: 1
id: ubsi.468157.002.ulk.combined.check
title: УЛК · совмещённая проверка ЯЛК-96 и ЯТП по ТУ 5.6
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Один отчёт: полный маршрут ЯЛК, затем три ручные точки ЯТП. Магазин
# подключён к общему X123 и переключается оператором на 0 / 120 / 240 Ом.
steps:
  - id: supply_status
    title: Включение и контроль питания УБСИ перед проверкой
    tu: 1.1.4.3, 1.1.4.5
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yalk_stream
    title: Запуск потока ЯЛК
    tu: 5.6 / ЯЛК
    procedure: yalk.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      configure_settle_ms: 500
      timeout_ms: 3000

  - id: yalk_calibration
    title: Калибровка ЯЛК по адресам 97 и 99
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    args:
      channel_count: 80
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2

  - id: yalk_initial
    title: Обрыв и исходное отключённое состояние 80 входов ЯЛК
    tu: 1.1.4.10
    procedure: yalk.check_initial_state
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      channel_count: 80
      sample_count: 4
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_channels
    title: Аналоговые и контактные сигналы 80 адресов ЯЛК
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    args:
      channel_count: 80
      point_volts: 0,3.1,6.2
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_overload
    title: Устойчивость остальных каналов при перегрузке ±12 В
    tu: 1.1.4.10, 1.1.4.11
    procedure: yalk.check_overload
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      # KPA report.log: ИСД ш = type=3, источники 95/96 и каналы 1..88.
      mapping_confirmed: true
      physical_channel_count: 88
      observed_address_count: 88
      positive_overload_route: yalk_overload_positive
      negative_overload_route: yalk_overload_negative
      sample_count: 4
      baseline_settle_ms: 1000
      settle_ms: 150
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_cleanup
    title: Сброс ЯЛК и контроль отсутствия воздействия
    tu: 5.6 / ЯЛК · завершение
    procedure: yalk.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
      - catalog.parameter_resolver
      - measure.reference_voltage
    args:
      channel_count: 80
      maximum_residual_voltage_v: 0.2
      settle_ms: 300
      retry_settle_ms: 500

  - id: ytp_stream
    title: Перевод адаптера в режим ЯТП
    tu: 5.6 / ЯТП
    procedure: ytp.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      protocol: rokt_ytp68
      ytp_endpoint: 1
      isd_switch_type: 7
      isd_route_channels: 3,9,12,17
      stream_settle_ms: 1000
      timeout_ms: 3000

  - id: ytp_calibration
    title: Калибровка ЯТП по словам 32 и 31
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
    args:
      calibration_zero_parameter: ytp_calibration_zero
      calibration_full_parameter: ytp_calibration_full
      calibration_mapping_confirmed: true
      sample_count: 16

  - id: ytp_channels
    title: Проверка 30 каналов ЯТП в точках 0 / 120 / 240 Ом
    tu: 1.1.4.1, 1.1.4.6, 1.1.4.14
    procedure: ytp.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - operator.manual_input
    args:
      channel_count: 30
      parameter_group: ytp_temperature
      resistance_points_ohm: 0,120,240
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500
      conversion_confirmed: true
      criteria_confirmed: true

  - id: ytp_cleanup
    title: Остановка потока ЯТП
    tu: 5.6 / завершение
    procedure: ytp.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      isd_switch_type: 7
      isd_route_channels: 3,9,12,17

  - id: power_off
    title: Отключение питания УБСИ после проверки
    tu: 5.6 / безопасное завершение
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
