schema: 1
id: ubsi.468157.002.yalk.tu5_6
title: УБСИ · полная проверка ЯЛК-96 по ТУ 5.6
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

steps:
  - id: supply_status
    title: Включение и контроль питания УБСИ перед проверкой
    tu: 1.1.4.3, 1.1.4.5
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yalk_stream
    title: Режим ЯЛК 8 кГц и запись сырого потока
    tu: 5.6 / ЯЛК
    procedure: yalk.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      configure_settle_ms: 500
      timeout_ms: 3000

  - id: yalk_calibration
    title: Калибровка ЯЛК по адресам УЛК 97 и 99
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    args:
      channel_count: 80
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2

  - id: yalk_initial
    title: Обрыв и исходное отключённое состояние 80 входов ЯЛК
    tu: 1.1.4.10
    procedure: yalk.check_initial_state
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      channel_count: 80
      sample_count: 4
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_channels
    title: Аналоговые и контактные сигналы ЯЛК в состояниях 0 и 1
    tu: 1.1.4.1, 1.1.4.14
    procedure: yalk.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    args:
      channel_count: 80
      point_volts: 0,3.1,6.2
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_overload
    title: Устойчивость остальных каналов при перегрузке ±12 В
    tu: 1.1.4.10, 1.1.4.11
    procedure: yalk.check_overload
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      # Живой прогон 04.09.2026 показал: прямой type=1 допускает num 1..64.
      # Карта команд для физических каналов 65..88 пока не подтверждена.
      mapping_confirmed: false
      physical_channel_count: 88
      observed_address_count: 88
      positive_overload_route: yalk_overload_positive
      negative_overload_route: yalk_overload_negative
      sample_count: 4
      baseline_settle_ms: 1000
      settle_ms: 150
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_cleanup
    title: Безопасный сброс ЯЛК и контроль отсутствия воздействия
    tu: 5.6 / завершение проверки
    procedure: yalk.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
      - catalog.parameter_resolver
      - measure.reference_voltage
    args:
      channel_count: 80
      maximum_residual_voltage_v: 0.2
      settle_ms: 300
      retry_settle_ms: 500

  - id: power_off
    title: Отключение питания УБСИ после проверки
    tu: 5.6 / безопасное завершение
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
