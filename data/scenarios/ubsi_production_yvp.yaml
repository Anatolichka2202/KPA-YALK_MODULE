schema: 1
id: ktma.ubsi.production.yvp
title: Производство УБСИ · ЯВП-8
version: 1.2.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Текущий подтверждённый тракт:
# Rigol DG-1022Z CH1 → вывод З кабеля ЯВП 8-2 → ЯВП-8 → адаптер КТМА → ROKT/UDP.
# Вывод Н и АКИП-1160/6 в сигнальном тракте ЯВП не участвуют.
#
# На текущем commissioning Rigol должен быть подключён и доступен по VISA,
# но 1 В выставляется оператором вручную. Автоматические set_sine/output пока
# запрещены профилем до подтверждения трактовки амплитуды (Vpp/peak/RMS).
# Команды ROKT выбора режима/каналов подтверждены, payload ещё не декодирован.
# Поэтому сценарий проверяет транспорт и обязан завершаться INCOMPLETE.
steps:
  - id: supply_status
    title: Включение и контроль питания перед проверкой ЯВП
    tu: PRODUCTION / YVP / POWER
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yvp_mode
    title: Готовность Rigol и перевод адаптера в режим ЯВП · ROKT 0A 01
    tu: PRODUCTION / YVP / ROKT_MODE
    procedure: yvp.enter_mode
    requires:
      - ulk.parameter_source
      - signal.generator
    args:
      yvp_cell: 1
      timeout_ms: 3000
      technical_retries: 3
      stimulus_source: rigol_ch1
      stimulus_nominal_v: 1
      stimulus_control: manual
      stimulus_amplitude_definition: TODO_CONFIRM

  - id: yvp_channels
    title: ЯВП-8 · выбор 8 каналов командой ROKT 0A 03 и контроль свежего UDP-трафика
    tu: PRODUCTION / YVP / ROKT_CHANNELS
    procedure: ubsi.yvp
    requires:
      - ulk.parameter_source
    args:
      channel_count: 8
      yvp_cell: 1
      timeout_ms: 3000

  - id: yvp_cleanup
    title: Безопасная остановка потока ЯВП
    tu: PRODUCTION / YVP / SAFE_CLEANUP
    procedure: yvp.safe_cleanup
    requires:
      - ulk.parameter_source

  - id: power_off
    title: Отключение питания УБСИ
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
