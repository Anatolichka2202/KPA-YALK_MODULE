schema: 1
id: ktma.ubsi.production.yvp
title: Производство УБСИ · ЯВП-8
version: 1.2.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Текущий подтверждённый тракт:
# Rigol DG-1022Z CH1 → вывод З кабеля ЯВП 8-2 → ЯВП-8 → адаптер КТМА → ROKT/UDP.
# Вывод Н и АКИП-1160/6 в сигнальном тракте ЯВП не участвуют.
#
# Автоматический commissioning разрешён: Rigol работает в Vpp, выбранный вход
# коммутируется ИСД, а результат читается существующим декодером кадров ЯЛК.
steps:
  - id: supply_status
    title: Включение и контроль питания перед проверкой ЯВП
    tu: PRODUCTION / YVP / POWER
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yvp_mode
    title: Перевод адаптера в режим ЯВП · ROKT 0A 01
    tu: PRODUCTION / YVP / ROKT_MODE
    procedure: yvp.enter_mode
    requires:
      - ulk.parameter_source
      - signal.generator
    args:
      yvp_cell: 1
      timeout_ms: 3000
      technical_retries: 3
      readout_yalk: true
      active_outputs_confirmed: true

  - id: yvp_channels
    title: ЯВП-8 · Rigol, ИСД, ROKT 0A 03 и чтение выходов через ЯЛК-96
    tu: PRODUCTION / YVP / ROKT_CHANNELS
    procedure: ubsi.yvp
    requires:
      - ulk.parameter_source
      - signal.generator
      - stand.switch_matrix
      - catalog.parameter_resolver
      - measure.reference_ac_voltage
      - measure.reference_frequency
    args:
      channel_count: 8
      yvp_cell: 1
      timeout_ms: 3000
      sample_count: 16
      yalk_addresses: 89,90,91,92,93,94,95,96
      yvp_input_contacts: 33,34,35,36,37,38,39,40
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,16,32
      frequencies_hz: 0.15,20,250,500,1800,2000,4000
      gain_test_frequency_hz: 20
      afc_reference_frequency_hz: 500
      working_low_frequency_hz: 20
      working_high_frequency_hz: 2000
      attenuation_min_db: 20
      coupling_capacitance_pf: 1000
      gain_tolerance_percent: 7
      frequency_tolerance_percent: 1
      stimulus_tolerance_percent: 5
      settle_ms: 200
      active_outputs_confirmed: true

  - id: yvp_cleanup
    title: Безопасная остановка потока ЯВП
    tu: PRODUCTION / YVP / SAFE_CLEANUP
    procedure: yvp.safe_cleanup
    requires:
      - ulk.parameter_source
      - signal.generator
      - stand.switch_matrix

  - id: power_off
    title: Отключение питания УБСИ
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
