schema: 1
id: ktma.ubsi.production.yvp
title: Производство УБСИ · ЯВП-8
version: 1.4.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Новый основной тракт ЯВП:
# Rigol DG-1022Z CH1 → C=1000 пФ → вход ЯВП-8 → выход ЯВП → ЯЛК-96 → ИСД → В7-78/1.
# Адаптер КТМА/ROKT не участвует в измерении этого backend.
#
# Предыдущие реализации через адаптер/ROKT и адресное чтение ЯЛК сохранены в коде,
# но production alias ubsi.yvp теперь указывает на V7+ISD backend.
#
# До трассировки Э3 ИСД mapping_confirmed остаётся false: сценарий гарантированно
# завершится INCOMPLETE ДО коммутации ИСД и ДО включения Rigol OUTPUT.
steps:
  - id: supply_status
    title: Включение и контроль питания перед проверкой ЯВП
    tu: PRODUCTION / YVP / POWER
    procedure: ubsi.supply_status
    resources:
      - resource: power.dut
        capability: power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yvp_measurement
    title: ЯВП-8 · прямое измерение через ИСД и В7
    tu: PRODUCTION / YVP / V7_ISD
    procedure: ubsi.yvp
    resources:
      - resource: signal.primary
        capability: signal.generator
      - resource: switch_matrix.primary
        capability: stand.switch_matrix
      - resource: measure.reference
        capability: measure.reference_ac_voltage
      - resource: measure.reference
        capability: measure.reference_frequency
    args:
      channel_count: 8
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      frequencies_hz: 0.15,20,250,500,1800,2000,4000
      coupling_capacitance_pf: 1000
      settle_ms: 200

      # Rigol автоматизирован; драйвер задаёт амплитуду в Vpp:
      # K=0.25 -> 8 Vpp; K=0.5 -> 4 Vpp; K=1 -> 2 Vpp; K>1 -> 1 Vpp.
      active_outputs_confirmed: true

      # Заполняется только после трассировки Э3 ИСД и проверки на стенде.
      mapping_confirmed: false
      # input_switch_type: TODO_CONFIRM
      # gain_switch_type: TODO_CONFIRM
      # measurement_switch_type: TODO_CONFIRM
      # input_1_contacts: TODO_CONFIRM
      # ... input_8_contacts
      # measurement_1_contacts: TODO_CONFIRM
      # ... measurement_8_contacts
      # gain_0_25_contacts: TODO_CONFIRM_OR_NONE
      # gain_0_5_contacts: TODO_CONFIRM_OR_NONE
      # gain_1_contacts: TODO_CONFIRM_OR_NONE
      # gain_2_contacts: TODO_CONFIRM_OR_NONE
      # gain_4_contacts: TODO_CONFIRM_OR_NONE
      # gain_8_contacts: TODO_CONFIRM_OR_NONE
      # gain_32_contacts: TODO_CONFIRM_OR_NONE

  - id: power_off
    title: Отключение питания УБСИ
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    resources:
      - resource: power.dut
        capability: power.dc_supply
