schema: 1
id: ktma.ubsi.production.yvp
# Production package for the installed YVP cell. Output is read only through
# YALK 89..96 / ULK words 88..95. Orbita/E20 is not a dependency.
title: Производство УБСИ · ЯВП-8
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

steps:
  - id: yalk_stream
    title: Запуск потока ЯЛК для выходов ЯВП
    tu: PRODUCTION / YVP / YALK_STREAM
    procedure: yalk.start_stream
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
    args:
      configure_settle_ms: 500
      timeout_ms: 3000

  - id: yalk_calibration
    title: Калибровка ЯЛК 97/99 перед чтением ЯВП
    tu: PRODUCTION / YVP / YALK_CALIBRATION
    procedure: yalk.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - measure.reference_voltage
    args:
      channel_count: 80
      sample_count: 16
      settle_ms: 150
      full_voltage: 6.2

  - id: yvp_check
    title: Коэффициенты усиления, АЧХ и затухание ЯВП-8 через ЯЛК 89–96
    tu: PRODUCTION / YVP
    procedure: ubsi.yvp
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - stand.switch_matrix
      - signal.generator
      - measure.reference_ac_voltage
      - measure.reference_frequency
    args:
      channel_count: 8
      parameter_group: yvp_fast
      frequencies_hz: 0.15,20,250,500,1800,2000,4000
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      coupling_capacitance_pf: 1000
      sample_count: 16
      gain_tolerance_percent: 7
      working_low_frequency_hz: 2
      working_high_frequency_hz: 2000
      input_route: yvp_input
      gain_route: yvp_gain
      # Commissioning gates. Until both become true, ubsi.yvp returns
      # INCOMPLETE before it configures/enables the generator.
      routes_confirmed: false
      yalk_value_model_confirmed: false
      stimulus_tolerance_percent: 5
      frequency_tolerance_percent: 1
      settle_ms: 200

  - id: yalk_cleanup
    title: Безопасный сброс ЯВП / ЯЛК
    tu: PRODUCTION / YVP / SAFE_CLEANUP
    procedure: yalk.safe_cleanup
    requires:
      - ulk.parameter_source
      - stand.switch_matrix
      - catalog.parameter_resolver
      - measure.reference_voltage
    args:
      channel_count: 80
      maximum_residual_voltage_v: 0.2
      settle_ms: 300
      retry_settle_ms: 500

  - id: power_off
    title: Отключение питания УБСИ
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
