schema: 1
id: ktma.ubsi.production.yvp
title: Производство УБСИ · ЯВП-8
version: 1.4.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Новый основной тракт ЯВП:
# Rigol DG-1022Z CH1 → C=1000 пФ → вход ЯВП-8 → выход ЯВП → ЯЛК-96 → ИСД → В7-78/1.
# Адаптер КТМА/ROKT не участвует в измерении этого backend.
#
# Предыдущие реализации через адаптер/ROKT и адресное чтение ЯЛК сохранены в коде,
# но production alias ubsi.yvp теперь указывает на V7+ISD backend.
#
# Карта ниже сведена из кабелей ЯВП8-1/ЯВП8-2, Э3 ИСД, таблиц
# KMTable/KMGlobalBusTable прошивки ИСД и референсных сценариев КПА.
steps:
  - id: supply_status
    title: Включение и контроль питания перед проверкой ЯВП
    tu: PRODUCTION / YVP / POWER
    procedure: ubsi.supply_status
    requires:
      - power.dc_supply
    args:
      nominal_voltage_v: 27
      minimum_voltage_v: 24
      maximum_voltage_v: 35
      maximum_current_a: 0.4
      startup_current_limit_a: 0.6
      startup_settle_ms: 500

  - id: yvp_measurement
    title: ЯВП-8 · прямое измерение через ИСД и В7
    tu: PRODUCTION / YVP / V7_ISD
    procedure: ubsi.yvp
    requires:
      - signal.generator
      - stand.switch_matrix
      - measure.reference_ac_voltage
      - measure.reference_frequency
    args:
      channel_count: 8
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      frequencies_hz: 0.15,20,250,500,1800,2000,4000
      coupling_capacitance_pf: 1000
      settle_ms: 200

      # Rigol автоматизирован; драйвер задаёт амплитуду в Vpp:
      # K=0.25 -> 8 Vpp; K=0.5 -> 4 Vpp; K=1 -> 2 Vpp; K>1 -> 1 Vpp.
      active_outputs_confirmed: true

      mapping_confirmed: true
      input_switch_type: 2
      gain_switch_type: 2
      measurement_analog_type: 1
      measurement_switch_type: 3

      # Два реле A3 выбирают физический вход ЯВП.
      input_1_contacts: 33,37
      input_2_contacts: 34,38
      input_3_contacts: 35,39
      input_4_contacts: 36,40
      input_5_contacts: 44,48
      input_6_contacts: 43,47
      input_7_contacts: 42,46
      input_8_contacts: 41,45

      # CH89..CH96 через A5/A6 на общую измерительную цепь V и В7.
      measurement_1_contacts: 43
      measurement_2_contacts: 42
      measurement_3_contacts: 40
      measurement_4_contacts: 41
      measurement_5_contacts: 39
      measurement_6_contacts: 38
      measurement_7_contacts: 37
      measurement_8_contacts: 35

      # Физические KU1..KU4 каждого канала на A2 (HTTP type=2).
      channel_1_gain_contacts: 1,2,3,4
      channel_2_gain_contacts: 5,6,7,8
      channel_3_gain_contacts: 9,10,11,12
      channel_4_gain_contacts: 13,14,15,16
      channel_5_gain_contacts: 17,18,19,20
      channel_6_gain_contacts: 21,22,23,24
      channel_7_gain_contacts: 25,26,27,28
      channel_8_gain_contacts: 29,30,31,32

      gain_0_25_bits: none
      gain_0_5_bits: 1
      gain_1_bits: 2
      gain_2_bits: 3
      gain_4_bits: 1,3
      gain_8_bits: 4
      gain_32_bits: 2,4

  - id: power_off
    title: Отключение питания УБСИ
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
