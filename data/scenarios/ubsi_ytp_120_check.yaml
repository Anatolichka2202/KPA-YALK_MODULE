schema: 1
id: ubsi.468157.002.ytp.120ohm.check
title: УБСИ · контроль 30 каналов ЯТП при 120 Ом
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Рабочий одноточечный контроль для стенда, на котором Р4831 постоянно
# установлен на 120 Ом. Это не заменяет полную проверку диапазона 0..240 Ом.
steps:
  - id: ytp_stream
    title: Активный запуск ROKT и запись сырого потока ЯТП
    tu: 5.6 / ЯТП · контроль 120 Ом
    procedure: ytp.start_stream
    requires:
      - ulk.parameter_source
    args:
      protocol: rokt_ytp68
      ytp_endpoint: 1
      stream_settle_ms: 1000
      timeout_ms: 3000

  - id: ytp_calibration
    title: Калибровка ЯТП по словам 32 и 31
    tu: 1.1.4.1, 1.1.4.14
    procedure: ytp.read_calibration
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
    args:
      calibration_zero_parameter: ytp_calibration_zero
      calibration_full_parameter: ytp_calibration_full
      calibration_mapping_confirmed: true
      sample_count: 16

  - id: ytp_channels
    title: Контроль 30 каналов при постоянно установленных 120 Ом
    tu: 1.1.4.1, 1.1.4.6, 1.1.4.14 · одна контрольная точка
    procedure: ytp.check_channels
    requires:
      - catalog.parameter_resolver
      - ulk.parameter_source
      - operator.manual_input
    args:
      channel_count: 30
      parameter_group: ytp_temperature
      resistance_points_ohm: 120
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500
      conversion_confirmed: true
      criteria_confirmed: true

  - id: ytp_cleanup
    title: Безопасная остановка потока и raw-записи ЯТП
    tu: 5.6 / завершение проверки
    procedure: ytp.safe_cleanup
    requires:
      - ulk.parameter_source
