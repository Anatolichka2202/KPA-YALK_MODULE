schema: 1
id: ktma.ubsi.production.power
# Production package: this is not a TU acceptance document. It reuses the
# same verified measurement procedures and stores the result in Production lifecycle.
title: Производство УБСИ · питание / потребление
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

steps:
  - id: supply_range
    title: Питание 24 / 27 / 35 В, общий ток и выдержки 19 / 37 В
    tu: PRODUCTION / POWER_CONSUMPTION
    procedure: ubsi.supply_range
    requires:
      - power.dc_supply
      - ulk.parameter_source
    args:
      voltage_points_v: 24,27,35
      maximum_total_current_a: 0.4
      # Защитная уставка АКИП не является нормативом потребления изделия.
      supply_current_limit_a: 0.6
      voltage_tolerance_v: 0.5
      settle_ms: 500
      survival_points_v: 19,37
      survival_seconds: 300,60
      restore_voltage_v: 27
      recovery_timeout_ms: 30000

  - id: power_off
    title: Безопасное отключение питания после производственной проверки
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires:
      - power.dc_supply
