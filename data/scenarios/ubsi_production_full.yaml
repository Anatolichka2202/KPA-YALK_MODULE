schema: 1
id: ktma.ubsi.production.full
title: Производство УБСИ · полная проверка
version: 1.0.0
catalog_version: 2026.08.29-yalk-1
object_type: UBSI_468157_002
state: published

# Production orchestration is intentionally separate from the TU scenario.
# Measurement callbacks and physical methods are shared; lifecycle/reporting are not.
steps:
  - id: readiness
    title: Готовность после холодного включения
    tu: PRODUCTION / READINESS
    procedure: ubsi.readiness
    requires: [power.dc_supply, ulk.parameter_source]
    args:
      voltage_v: 27
      current_limit_a: 0.6
      off_settle_ms: 500
      timeout_ms: 30000

  - id: supply_range
    title: Питание / потребление / предельные напряжения
    tu: PRODUCTION / POWER_CONSUMPTION
    procedure: ubsi.supply_range
    requires: [power.dc_supply, ulk.parameter_source]
    args:
      voltage_points_v: 24,27,35
      maximum_total_current_a: 0.4
      supply_current_limit_a: 0.6
      voltage_tolerance_v: 0.5
      settle_ms: 500
      survival_points_v: 19,37
      survival_seconds: 300,60
      restore_voltage_v: 27
      recovery_timeout_ms: 30000

  - id: yalk_stream
    title: Запуск потока ЯЛК
    tu: PRODUCTION / YALK / STREAM
    procedure: yalk.start_stream
    requires: [ulk.parameter_source, stand.switch_matrix]
    args: {configure_settle_ms: 500, timeout_ms: 3000}

  - id: yalk_calibration
    title: Калибровка ЯЛК 97/99
    tu: PRODUCTION / YALK / CALIBRATION
    procedure: yalk.read_calibration
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args: {channel_count: 80, sample_count: 16, settle_ms: 150, full_voltage: 6.2}

  - id: yalk_initial
    title: Исходное состояние ЯЛК
    tu: PRODUCTION / YALK / INITIAL
    procedure: yalk.check_initial_state
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix]
    args: {channel_count: 80, sample_count: 4, full_scale_v: 6.2, tolerance_percent_fs: 0.5}

  - id: yalk_channels
    title: Аналоговые каналы ЯЛК · 0 / 3,1 / 6,2 В
    tu: PRODUCTION / YALK / ANALOG
    procedure: yalk.check_channels
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      channel_count: 80
      point_volts: 0,3.1,6.2
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_contacts
    title: Контакты ЯЛК · 0 / 0,9 / 2,5 В
    tu: PRODUCTION / YALK / CONTACTS
    procedure: yalk.check_channels
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args:
      channel_count: 80
      point_volts: 0,0.9,2.5
      signal_expectations: 0,0,1
      sample_count: 16
      settle_ms: 150
      channel_off_settle_ms: 1000
      full_scale_v: 6.2
      tolerance_percent_fs: 0.5

  - id: yalk_overload
    title: ЯЛК · перегрузка ±12 В
    tu: PRODUCTION / YALK / OVERLOAD
    procedure: yalk.check_overload
    requires: [ulk.parameter_source, stand.switch_matrix]
    args:
      mapping_confirmed: true
      physical_channel_count: 88
      observed_address_count: 88
      positive_overload_route: yalk_overload_positive
      negative_overload_route: yalk_overload_negative
      sample_count: 4
      baseline_settle_ms: 1000
      overload_settle_ms: 10000
      cleanup_settle_ms: 300
      maximum_code_delta: 2

  - id: yalk_reference_voltage
    title: Эталон 6,2 ±0,03 В по В7 и ЯЛК
    tu: PRODUCTION / YALK / REFERENCE_6V2
    procedure: ubsi.reference_voltage
    requires: [measure.reference_voltage, catalog.parameter_resolver, ulk.parameter_source]
    args:
      nominal_v: 6.2
      tolerance_v: 0.03
      adapter_parameter_group: yalk_reference_supply
      calibration_zero_parameter: yalk_calibration_zero
      calibration_full_parameter: yalk_calibration_full
      sample_count: 16

  - id: yalk_cleanup
    title: Безопасный сброс ЯЛК
    tu: PRODUCTION / YALK / SAFE_CLEANUP
    procedure: yalk.safe_cleanup
    requires: [ulk.parameter_source, stand.switch_matrix, catalog.parameter_resolver, measure.reference_voltage]
    args: {channel_count: 80, maximum_residual_voltage_v: 0.2, settle_ms: 300, retry_settle_ms: 500}

  - id: ytp_stream
    title: Запуск потока ЯТП
    tu: PRODUCTION / YTP / STREAM
    procedure: ytp.start_stream
    requires: [ulk.parameter_source, stand.switch_matrix]
    args:
      protocol: rokt_ytp68
      ytp_endpoint: 1
      isd_switch_type: 7
      isd_route_channels: 3,9,12,17
      stream_settle_ms: 1000
      timeout_ms: 3000

  - id: ytp_calibration
    title: Калибровка ЯТП 32/31
    tu: PRODUCTION / YTP / CALIBRATION
    procedure: ytp.read_calibration
    requires: [catalog.parameter_resolver, ulk.parameter_source]
    args:
      calibration_zero_parameter: ytp_calibration_zero
      calibration_full_parameter: ytp_calibration_full
      calibration_mapping_confirmed: true
      sample_count: 16

  - id: ytp_channels
    title: ЯТП · 30 каналов · 0 / 120 / 240 Ом
    tu: PRODUCTION / YTP / CHANNELS
    procedure: ytp.check_channels
    requires: [catalog.parameter_resolver, ulk.parameter_source, operator.manual_input]
    args:
      channel_count: 30
      parameter_group: ytp_temperature
      resistance_points_ohm: 0,120,240
      full_scale_ohm: 240
      tolerance_percent_fs: 0.5
      sample_count: 16
      settle_ms: 1500
      conversion_confirmed: true
      criteria_confirmed: true

  - id: ytp_cleanup
    title: Безопасная остановка ЯТП
    tu: PRODUCTION / YTP / SAFE_CLEANUP
    procedure: ytp.safe_cleanup
    requires: [ulk.parameter_source, stand.switch_matrix]
    args: {isd_switch_type: 7, isd_route_channels: "3,9,12,17"}

  - id: yvp_yalk_stream
    title: Поток ЯЛК для ЯВП-8
    tu: PRODUCTION / YVP / YALK_STREAM
    procedure: yalk.start_stream
    requires: [ulk.parameter_source, stand.switch_matrix]
    args: {configure_settle_ms: 500, timeout_ms: 3000}

  - id: yvp_yalk_calibration
    title: Калибровка ЯЛК перед ЯВП
    tu: PRODUCTION / YVP / YALK_CALIBRATION
    procedure: yalk.read_calibration
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, measure.reference_voltage]
    args: {channel_count: 80, sample_count: 16, settle_ms: 150, full_voltage: 6.2}

  - id: yvp_check
    title: ЯВП-8 · коэффициенты, АЧХ, затухание · ЯЛК 89–96
    tu: PRODUCTION / YVP
    procedure: ubsi.yvp
    requires: [catalog.parameter_resolver, ulk.parameter_source, stand.switch_matrix, signal.generator, measure.reference_ac_voltage, measure.reference_frequency]
    args:
      channel_count: 8
      parameter_group: yvp_fast
      frequencies_hz: 0.15,20,250,500,1800,2000,4000
      gains_mv_per_pcl: 0.25,0.5,1,2,4,8,32
      coupling_capacitance_pf: 1000
      sample_count: 16
      gain_tolerance_percent: 7
      working_low_frequency_hz: 2
      working_high_frequency_hz: 2000
      input_route: yvp_input
      gain_route: yvp_gain
      routes_confirmed: false
      yalk_value_model_confirmed: false
      stimulus_tolerance_percent: 5
      frequency_tolerance_percent: 1
      settle_ms: 200

  - id: yvp_cleanup
    title: Безопасный сброс ЯВП / ЯЛК
    tu: PRODUCTION / YVP / SAFE_CLEANUP
    procedure: yalk.safe_cleanup
    requires: [ulk.parameter_source, stand.switch_matrix, catalog.parameter_resolver, measure.reference_voltage]
    args: {channel_count: 80, maximum_residual_voltage_v: 0.2, settle_ms: 300, retry_settle_ms: 500}

  - id: power_off
    title: Отключение питания
    tu: PRODUCTION / SAFE_CLEANUP
    procedure: ubsi.power_safe_off
    requires: [power.dc_supply]
