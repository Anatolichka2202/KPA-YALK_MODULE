<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>МилТех Станция · УБСИ</title>
  <link rel="stylesheet" href="test.css?v=1">
</head>
<body>
  <div class="test-window">
    <header class="titlebar">
      <div class="brand">
        <img src="miltech-industrial-mark.svg" alt="МилТех" style="filter:none">
        <div><b>МИЛТЕХ СТАНЦИЯ</b><small>КТМА · УБСИ · испытательная сессия</small></div>
      </div>
      <div class="station-state"><i></i><b>СТЕНД ГОТОВ</b><span>Сессия УБСИ-01</span><span>14:25:04</span></div>
      <button class="admin-key" id="open-admin"><kbd>F12</kbd> АДМИНИСТРАТИВНЫЙ</button>
    </header>

    <main id="test-root"></main>

    <footer class="commandbar">
      <div class="result"><small>ИТОГ</small><b id="footer-result">ВЫПОЛНЯЕТСЯ</b></div>
      <div class="footer-progress"><span id="footer-step">ЯЛК-96 · каналы 57 / 80</span><div><i id="footer-progress" style="width:71%"></i></div></div>
      <button class="secondary">ОТЧЁТ</button>
      <button class="danger" id="safe-stop">БЕЗОПАСНО ОСТАНОВИТЬ</button>
      <button class="primary" id="start-test">ЗАПУСТИТЬ</button>
    </footer>
  </div>

  <div class="dialog-layer" id="resistance-layer" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="resistance-title">
      <div class="dialog-head">
        <div><small>РУЧНАЯ ОПЕРАЦИЯ · Р4831</small><h2 id="resistance-title">Точка ЯТП · канал 01 / 30</h2></div>
        <button class="close-dialog" data-close-dialog>×</button>
      </div>
      <div class="target-value"><small>УСТАНОВИТЬ НА МАГАЗИНЕ</small><b id="resistance-target">120 Ω</b><span>Р4831 подключён к общему X123</span></div>
      <div class="dialog-form">
        <label>Фактическое значение, Ω<input value="120,34" inputmode="decimal"></label>
        <label>Допуск<input value="± 0,50 %" readonly></label>
      </div>
      <label class="confirmation"><input type="checkbox" id="resistance-confirm"> Р4831 установлен на заданное сопротивление</label>
      <div class="audit"><span>Оператор: <b>Иванов И.И.</b></span><span>Время: <b>10:21:14</b></span></div>
      <div class="dialog-buttons"><button class="secondary" data-close-dialog>ОТМЕНА</button><button class="primary" id="confirm-resistance" disabled>ПОДТВЕРДИТЬ ТОЧКУ</button></div>
    </section>
  </div>

  <script src="test.js?v=1"></script>
</body>
</html>
